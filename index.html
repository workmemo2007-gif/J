<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سماء سحابية</title>
  <style>
    /* إعدادات الخلفية العامة (السماء) */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(to bottom, #1e70eb 0%, #72afed 70%, #a6d2ff 100%);
      position: relative;
    }

    /* حاوية الغيوم */
    .clouds-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none; /* لتسمح بالنقر على العناصر خلفها */
    }

    /* شكل الغيمة الأساسي */
    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 100px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      animation: moveClouds linear infinite;
    }

    /* تفاصيل وشكل الغيمة باستخدام المفاهيم الزائفة ::before و ::after */
    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
    }

    .cloud::before {
      width: 50%;
      height: 100%;
      top: -40%;
      right: 15%;
    }

    .cloud::after {
      width: 40%;
      height: 80%;
      top: -30%;
      left: 15%;
    }

    /* أحجام ومواقع مختلفة للغيوم سرعات الحركة */
    .cloud1 {
      width: 300px;
      height: 100px;
      top: 15%;
      animation-duration: 35s;
      opacity: 0.9;
    }

    .cloud2 {
      width: 200px;
      height: 70px;
      top: 40%;
      animation-duration: 25s;
      animation-delay: -10s;
      opacity: 0.7;
      transform: scale(0.8);
    }

    .cloud3 {
      width: 400px;
      height: 120px;
      top: 60%;
      animation-duration: 50s;
      animation-delay: -20s;
      opacity: 0.8;
      transform: scale(1.1);
    }

    .cloud4 {
      width: 250px;
      height: 80px;
      top: 5%;
      animation-duration: 30s;
      animation-delay: -5s;
      opacity: 0.85;
      transform: scale(0.9);
    }

    /* حركة تحريك الغيوم من اليسار إلى اليمين */
    @keyframes moveClouds {
      0% {
        right: -30%;
      }
      100% {
        right: 110%;
      }
    }
  </style>
</head>
<body>

  <!-- حاوية الغيوم المتحركة -->
  <div class="clouds-container">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
    <div class="cloud cloud4"></div>
  </div>

  <!-- محتوى موقعك يأتي هنا -->

</body>
</html>
