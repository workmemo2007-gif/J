<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لغز ترتيب الصورة المبعثرة - علويتي رتاج</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #f0f9ff 100%);
            min-height: 100vh;
            user-select: none;
            overflow-x: hidden;
        }

        /* TV Screen Frame */
        .tv-frame {
            position: relative;
            perspective: 1000px;
        }

        .tv-screen {
            background-color: #0f172a;
            position: relative;
            overflow: hidden;
            border: 6px solid #334155;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9), 0 12px 25px -5px rgba(0, 0, 0, 0.4);
            transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tv-screen.broken::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .tv-screen.broken .glitch-text {
            animation: glitch 1.5s infinite linear alternate-reverse;
        }

        @keyframes glitch {
            0% { transform: translate(0); text-shadow: -2px 0 #ff0055, 2px 0 #00e5ff; }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); text-shadow: 2px 0 #ff0055, -2px 0 #00e5ff; }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); text-shadow: -2px 0 #ff0055, -2px 0 #00e5ff; }
        }

        .tv-screen.active {
            background: #0f172a;
            border-color: #38bdf8;
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.7), inset 0 0 15px rgba(255, 255, 255, 0.6);
        }

        /* 3D Pop-out Bear Styling */
        .bear-3d-wrapper {
            position: absolute;
            top: -28px;
            right: -20px;
            z-index: 30;
            filter: drop-shadow(0 15px 12px rgba(0, 0, 0, 0.45));
            transform: translateZ(30px) rotate(-4deg);
            transition: transform 0.4s ease;
        }

        .bear-3d-wrapper:hover {
            transform: translateZ(45px) rotate(0deg) scale(1.05);
        }

        .bear-sad {
            animation: headShake 0.8s ease-in-out;
        }

        .bear-happy {
            animation: happyJump 0.6s ease-in-out infinite alternate;
        }

        @keyframes headShake {
            0%, 100% { transform: translateZ(30px) rotate(-4deg) translateX(0); }
            20% { transform: translateZ(30px) rotate(-8deg) translateX(-8px); }
            40% { transform: translateZ(30px) rotate(4deg) translateX(8px); }
            60% { transform: translateZ(30px) rotate(-6deg) translateX(-5px); }
            80% { transform: translateZ(30px) rotate(2deg) translateX(5px); }
        }

        @keyframes happyJump {
            0% { transform: translateZ(30px) translateY(0) scale(1); }
            100% { transform: translateZ(50px) translateY(-14px) scale(1.08); }
        }

        /* Button Animations */
        .btn-shake-red {
            animation: shakeRed 0.6s cubic-bezier(.36,.07,.19,.97) both;
            background: linear-gradient(135deg, #ef4444, #dc2626) !important;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.7) !important;
            color: white !important;
        }

        @keyframes shakeRed {
            10%, 90% { transform: translate3d(-2px, 0, 0) scale(1.02); }
            20%, 80% { transform: translate3d(4px, 0, 0) scale(1.02); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0) scale(1.02); }
            40%, 60% { transform: translate3d(6px, 0, 0) scale(1.02); }
        }

        .btn-shake-green {
            animation: shakeGreen 0.6s cubic-bezier(.36,.07,.19,.97) both;
            background: linear-gradient(135deg, #10b981, #059669) !important;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.8) !important;
            color: white !important;
        }

        @keyframes shakeGreen {
            0% { transform: scale(1); }
            30% { transform: scale(1.15) rotate(3deg); }
            50% { transform: scale(1.1) rotate(-3deg); }
            70% { transform: scale(1.12) rotate(2deg); }
            100% { transform: scale(1); }
        }

        /* Puzzle Styling */
        .puzzle-tile {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            touch-action: manipulation;
            background-repeat: no-repeat;
        }

        .puzzle-tile:hover {
            transform: scale(1.03);
            filter: brightness(1.05);
        }

        .selected-tile {
            outline: 3px solid #0284c7;
            outline-offset: -3px;
            box-shadow: 0 0 12px rgba(2, 132, 199, 0.8);
        }

        .connected-image {
            animation: popConnected 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popConnected {
            0% { transform: scale(0.92); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen p-3 md:p-6 text-slate-800">

    <div class="w-full max-w-2xl flex flex-col items-center gap-5 my-auto">
        
        <div class="w-full tv-frame">
            
            <div id="bearContainer" class="bear-3d-wrapper w-28 h-28 md:w-36 md:h-36 pointer-events-none">
                <svg id="bearSvg" viewBox="0 0 200 200" class="w-full h-full">
                    <defs>
                        <radialGradient id="bearBodyGrad" cx="30%" cy="30%" r="70%">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="60%" stop-color="#bae6fd"/>
                            <stop offset="100%" stop-color="#0284c7"/>
                        </radialGradient>
                        <radialGradient id="earGrad" cx="30%" cy="30%" r="70%">
                            <stop offset="0%" stop-color="#38bdf8"/>
                            <stop offset="100%" stop-color="#0369a1"/>
                        </radialGradient>
                        <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="2" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
                        </filter>
                    </defs>

                    <circle id="leftEar" cx="40" cy="50" r="24" fill="url(#earGrad)" stroke="#e0f2fe" stroke-width="4" filter="url(#shadow3d)" />
                    <circle cx="40" cy="50" r="12" fill="#bae6fd" />
                    <circle id="rightEar" cx="160" cy="50" r="24" fill="url(#earGrad)" stroke="#e0f2fe" stroke-width="4" filter="url(#shadow3d)" />
                    <circle cx="160" cy="50" r="12" fill="#bae6fd" />
                    
                    <line x1="100" y1="38" x2="100" y2="16" stroke="#0284c7" stroke-width="6" stroke-linecap="round" />
                    <circle id="antennaBall" cx="100" cy="12" r="10" fill="#38bdf8" filter="url(#shadow3d)" class="animate-pulse" />

                    <rect x="30" y="40" width="140" height="130" rx="50" fill="url(#bearBodyGrad)" stroke="#0284c7" stroke-width="5" filter="url(#shadow3d)" />
                    
                    <circle cx="58" cy="120" r="11" fill="#f472b6" opacity="0.6" />
                    <circle cx="142" cy="120" r="11" fill="#f472b6" opacity="0.6" />

                    <g id="eyesNeutral">
                        <ellipse cx="68" cy="95" rx="9" ry="11" fill="#0f172a" />
                        <circle cx="71" cy="91" r="3.5" fill="#ffffff" />
                        <ellipse cx="132" cy="95" rx="9" ry="11" fill="#0f172a" />
                        <circle cx="135" cy="91" r="3.5" fill="#ffffff" />
                    </g>

                    <g id="eyesSad" class="hidden">
                        <path d="M 58 92 Q 68 104 78 92" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
                        <path d="M 122 92 Q 132 104 142 92" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
                        <path d="M 56 102 C 53 112, 60 120, 60 120 C 60 120, 66 112, 63 102 Z" fill="#38bdf8" />
                    </g>

                    <g id="eyesHappy" class="hidden">
                        <path d="M 58 100 Q 68 82 78 100" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round" />
                        <path d="M 122 100 Q 132 82 142 100" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round" />
                        <path d="M 100 60 L 103 68 L 110 70 L 103 72 L 100 80 L 97 72 L 90 70 L 97 68 Z" fill="#f59e0b" />
                    </g>

                    <ellipse cx="100" cy="118" rx="22" ry="15" fill="#f0f9ff" />
                    <ellipse cx="100" cy="112" rx="8" ry="5" fill="#0369a1" />

                    <path id="mouthNeutral" d="M 93 122 Q 100 127 107 122" fill="none" stroke="#0369a1" stroke-width="4" stroke-linecap="round" />
                    <path id="mouthSad" d="M 92 126 Q 100 117 108 126" fill="none" stroke="#0369a1" stroke-width="4" stroke-linecap="round" class="hidden" />
                    <path id="mouthHappy" d="M 90 120 Q 100 135 110 120 Z" fill="#0369a1" class="hidden" />
                </svg>
            </div>

            <div id="tvScreen" class="tv-screen broken rounded-3xl h-36 md:h-44 flex flex-col items-center justify-center p-4 text-center">
                
                <div id="screenOffContent" class="flex flex-col items-center gap-1 mt-2">
                    <div class="flex items-center gap-1.5 text-slate-400">
                        <svg class="w-5 h-5 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"></path>
                        </svg>
                        <span class="text-xs md:text-sm font-bold tracking-wider opacity-80">الشاشة معطلة</span>
                    </div>
                    <p class="glitch-text text-sky-300/70 text-xs md:text-sm font-mono font-bold">=== NO SIGNAL ===</p>
                </div>

                <div id="screenOnContent" class="hidden w-full h-full flex flex-col items-center justify-center relative overflow-hidden">
                    <img id="fullPreviewImage" class="w-full h-full object-cover rounded-xl shadow-md" alt="Completed Image" />
                    <div class="absolute bottom-2 bg-black/70 backdrop-blur-sm text-white text-xs px-4 py-1 rounded-full font-bold">
                        علويتي رتاج ✨
                    </div>
                </div>
            </div>

        </div>

        <div id="bearSpeech" class="bg-white/90 backdrop-blur border border-sky-200 text-sky-900 text-xs md:text-sm font-bold px-5 py-2 rounded-full shadow-sm transition-all duration-300">
            رتب أجزاء الصورة المبعثرة لإعادة تشغيل الشاشة! 🤖
        </div>

        <div class="w-full bg-white/80 backdrop-blur-md rounded-3xl p-4 md:p-6 shadow-xl border border-sky-100 flex flex-col items-center gap-5">
            
            <div id="boardWrapper" class="relative w-64 h-64 md:w-80 md:h-80">
                <div id="puzzleBoard" class="grid grid-cols-3 gap-1.5 p-2 bg-sky-500/10 rounded-2xl border-2 border-dashed border-sky-300 w-full h-full shadow-inner">
                </div>

                <div id="connectedBoard" class="hidden absolute inset-0 w-full h-full rounded-2xl overflow-hidden border-4 border-emerald-400 shadow-2xl connected-image">
                    <img id="completedPuzzleImg" class="w-full h-full object-cover" alt="Connected Result" />
                    <div class="absolute inset-0 bg-gradient-to-t from-emerald-500/20 to-transparent pointer-events-none"></div>
                </div>
            </div>

            <div class="flex items-center justify-center gap-3 pt-1 w-full max-w-sm">
                <button id="finishBtn" class="flex-1 py-3.5 bg-gradient-to-r from-sky-400 to-sky-500 hover:from-sky-500 hover:to-sky-600 text-white font-black text-sm md:text-base rounded-2xl shadow-lg shadow-sky-300/50 transform active:scale-95 transition-all duration-200 flex items-center justify-center gap-2">
                    <span>تم الإنهاء</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
                    </svg>
                </button>

                <button id="resetBtn" class="px-5 py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-sm rounded-2xl transition-all duration-200 flex items-center justify-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    <span>إعادة المحاولة</span>
                </button>
            </div>

        </div>

    </div>

    <script>
        const PUZZLE_IMAGE_URL = 'https://raw.githubusercontent.com/workmemo2007-gif/R1/8cdc86bc9d87047114af81f2a2f85f77cb6e33b4/IMG_2540.jpeg';
        
        const GRID_SIZE = 3;
        const TOTAL_TILES = GRID_SIZE * GRID_SIZE;

        // الترتيب الصحيح للحل
        const TARGET_BOARD = [2, 1, 0, 5, 4, 3, 8, 7, 6];

        let currentBoard = [];
        let selectedTileIndex = null;

        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playTap() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(850, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playError() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.setValueAtTime(130, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.35);
            }

            playSuccess() {
                this.init();
                if (!this.ctx) return;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.1);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.1);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.1 + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.1);
                    osc.stop(this.ctx.currentTime + idx * 0.1 + 0.25);
                });
            }
        }

        const soundFX = new SoundFX();

        const puzzleBoard = document.getElementById('puzzleBoard');
        const connectedBoard = document.getElementById('connectedBoard');
        const completedPuzzleImg = document.getElementById('completedPuzzleImg');
        const finishBtn = document.getElementById('finishBtn');
        const resetBtn = document.getElementById('resetBtn');
        const tvScreen = document.getElementById('tvScreen');
        const screenOffContent = document.getElementById('screenOffContent');
        const screenOnContent = document.getElementById('screenOnContent');
        const fullPreviewImage = document.getElementById('fullPreviewImage');

        const bearContainer = document.getElementById('bearContainer');
        const eyesNeutral = document.getElementById('eyesNeutral');
        const eyesSad = document.getElementById('eyesSad');
        const eyesHappy = document.getElementById('eyesHappy');
        const mouthNeutral = document.getElementById('mouthNeutral');
        const mouthSad = document.getElementById('mouthSad');
        const mouthHappy = document.getElementById('mouthHappy');
        const bearSpeech = document.getElementById('bearSpeech');
        const antennaBall = document.getElementById('antennaBall');

        fullPreviewImage.src = PUZZLE_IMAGE_URL;
        completedPuzzleImg.src = PUZZLE_IMAGE_URL;

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initGame() {
            selectedTileIndex = null;
            let solved = true;
            while (solved) {
                const indexes = Array.from({ length: TOTAL_TILES }, (_, i) => i);
                currentBoard = shuffleArray(indexes);
                solved = currentBoard.every((val, idx) => val === TARGET_BOARD[idx]);
            }

            puzzleBoard.classList.remove('hidden');
            connectedBoard.classList.add('hidden');

            setBearState('neutral');
            resetScreen();
            resetButtonStyles();
            renderBoard();
        }

        function renderBoard() {
            puzzleBoard.innerHTML = '';

            currentBoard.forEach((originalIndex, boardPosition) => {
                const tile = document.createElement('div');
                tile.className = 'puzzle-tile w-full h-full rounded-xl cursor-pointer border-2 border-white/60 shadow-md relative overflow-hidden select-none';

                const row = Math.floor(originalIndex / GRID_SIZE);
                const col = originalIndex % GRID_SIZE;
                
                const posX = col * 50;
                const posY = row * 50;

                tile.style.backgroundImage = `url('${PUZZLE_IMAGE_URL}')`;
                tile.style.backgroundSize = '300% 300%';
                tile.style.backgroundPosition = `${posX}% ${posY}%`;

                if (selectedTileIndex === boardPosition) {
                    tile.classList.add('selected-tile');
                }

                tile.onclick = () => handleTileClick(boardPosition);

                puzzleBoard.appendChild(tile);
            });
        }

        function handleTileClick(position) {
            soundFX.playTap();

            if (selectedTileIndex === null) {
                selectedTileIndex = position;
            } else if (selectedTileIndex === position) {
                selectedTileIndex = null;
            } else {
                const temp = currentBoard[selectedTileIndex];
                currentBoard[selectedTileIndex] = currentBoard[position];
                currentBoard[position] = temp;
                selectedTileIndex = null;
            }

            renderBoard();
        }

        function setBearState(state) {
            bearContainer.classList.remove('bear-sad', 'bear-happy');
            eyesNeutral.classList.add('hidden');
            eyesSad.classList.add('hidden');
            eyesHappy.classList.add('hidden');
            mouthNeutral.classList.add('hidden');
            mouthSad.classList.add('hidden');
            mouthHappy.classList.add('hidden');

            if (state === 'sad') {
                bearContainer.classList.add('bear-sad');
                eyesSad.classList.remove('hidden');
                mouthSad.classList.remove('hidden');
                bearSpeech.innerText = "أوووه! ترتيب الصورة غير صحيح 😢 حاول مجدداً!";
                bearSpeech.className = "bg-rose-50 border border-rose-200 text-rose-700 text-xs md:text-sm font-bold px-5 py-2 rounded-full shadow-sm animate-bounce";
                antennaBall.setAttribute('fill', '#ef4444');
            } else if (state === 'happy') {
                bearContainer.classList.add('bear-happy');
                eyesHappy.classList.remove('hidden');
                mouthHappy.classList.remove('hidden');
                bearSpeech.innerText = "مذهل جداً! اكتملت الصورة واشتغلت الشاشة 🎉";
                bearSpeech.className = "bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs md:text-sm font-bold px-5 py-2 rounded-full shadow-sm";
                antennaBall.setAttribute('fill', '#10b981');
            } else {
                eyesNeutral.classList.remove('hidden');
                mouthNeutral.classList.remove('hidden');
                bearSpeech.innerText = "رتب أجزاء الصورة المبعثرة لإعادة تشغيل الشاشة! 🤖";
                bearSpeech.className = "bg-white/90 border border-sky-200 text-sky-900 text-xs md:text-sm font-bold px-5 py-2 rounded-full shadow-sm";
                antennaBall.setAttribute('fill', '#38bdf8');
            }
        }

        function activateScreen() {
            tvScreen.classList.remove('broken');
            tvScreen.classList.add('active');
            screenOffContent.classList.add('hidden');
            screenOnContent.classList.remove('hidden');
        }

        function resetScreen() {
            tvScreen.classList.remove('active');
            tvScreen.classList.add('broken');
            screenOffContent.classList.remove('hidden');
            screenOnContent.classList.add('hidden');
        }

        function resetButtonStyles() {
            finishBtn.className = "flex-1 py-3.5 bg-gradient-to-r from-sky-400 to-sky-500 hover:from-sky-500 hover:to-sky-600 text-white font-black text-sm md:text-base rounded-2xl shadow-lg shadow-sky-300/50 transform active:scale-95 transition-all duration-200 flex items-center justify-center gap-2";
        }

        function checkAnswer() {
            resetButtonStyles();

            const isCorrect = currentBoard.every((val, index) => val === TARGET_BOARD[index]);

            if (isCorrect) {
                soundFX.playSuccess();
                setBearState('happy');
                activateScreen();
                finishBtn.classList.add('btn-shake-green');

                // إخفاء التقطيع وإظهار الصورة كاملة المتصلة
                puzzleBoard.classList.add('hidden');
                connectedBoard.classList.remove('hidden');

                if (window.confetti) {
                    confetti({
                        particleCount: 130,
                        spread: 85,
                        origin: { y: 0.6 }
                    });
                }
            } else {
                soundFX.playError();
                setBearState('sad');
                resetScreen();
                finishBtn.classList.add('btn-shake-red');

                setTimeout(() => {
                    finishBtn.classList.remove('btn-shake-red');
                }, 700);
            }
        }

        finishBtn.addEventListener('click', checkAnswer);
        resetBtn.addEventListener('click', () => {
            soundFX.playTap();
            initGame();
        });

        window.onload = function() {
            initGame();
        };
    </script>
</body>
</html>
