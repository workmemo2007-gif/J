<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ايس هوم | Ice Home - القائمة الرقمية الفاخرة</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Aref Ruqaa (خط الرقعة العربي الفاخر) & Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;700;900&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        burgundy: {
                            50: '#fcf2f4',
                            100: '#f6dbe0',
                            200: '#ebaac2',
                            600: '#8c1a35',
                            700: '#6b1d2f',
                            800: '#58111a',
                            900: '#3d0a11',
                        },
                        offwhite: {
                            DEFAULT: '#FAF8f5',
                            card: '#FFFDF9',
                            soft: '#F4EFEA',
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        ruqaa: ['Aref Ruqaa', 'serif'],
                        english: ['Fredoka', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Aref Ruqaa', 'Cairo', serif;
            background-color: #FAF8f5;
            color: #FAF8f5;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* خلفية الصورة مع التظليل الداكن 0.5 */
        .custom-bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://raw.githubusercontent.com/workmemo2007-gif/J/d40a2080aeb7b9c4ff515579cf26f7fed990e385/IMG_2730.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* خط الرقعة غير مفرغ ومشع بلون الأوف وايت */
        .ruqaa-title-arabic {
            font-family: 'Aref Ruqaa', serif;
            color: #FAF8f5;
            text-shadow: 0 0 12px rgba(250, 248, 245, 0.9), 
                         0 0 25px rgba(250, 248, 245, 0.6), 
                         0 0 35px rgba(245, 158, 11, 0.4);
            letter-spacing: 1px;
        }

        .ruqaa-title-english {
            font-family: 'Fredoka', sans-serif;
            color: #FAF8f5;
            text-shadow: 0 0 10px rgba(250, 248, 245, 0.8), 
                         0 0 20px rgba(245, 158, 11, 0.5);
            letter-spacing: 2px;
        }

        /* تأثير الزجاج الشفاف بنسبة 80% */
        .glass-btn-ultra {
            background: rgba(250, 248, 245, 0.20) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(250, 248, 245, 0.35) !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2) !important;
            color: #FAF8f5 !important;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
        }

        .glass-btn-ultra:hover {
            background: rgba(250, 248, 245, 0.32) !important;
            border-color: rgba(250, 248, 245, 0.6) !important;
            transform: translateY(-2px);
        }

        .glass-btn-burgundy {
            background: rgba(88, 17, 26, 0.25) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(250, 248, 245, 0.3) !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25) !important;
            color: #FAF8f5 !important;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
        }

        /* تصميم كروت الأقسام المغلقة والمفتوحة */
        .category-integrated-card {
            background: rgba(250, 248, 245, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(107, 29, 47, 0.25);
            border-radius: 9999px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            color: #3d0a11;
            font-family: 'Aref Ruqaa', serif;
        }

        .category-integrated-card.is-open {
            border-radius: 2rem;
            border-color: #6b1d2f;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
            background: rgba(255, 253, 249, 0.97);
        }

        .expanded-dishes-wrapper {
            max-height: 0;
            opacity: 0;
            transition: max-height 0.65s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.45s ease;
        }

        .category-integrated-card.is-open .expanded-dishes-wrapper {
            opacity: 1;
        }

        .carousel-wrapper-3d {
            position: relative;
            width: 100%;
            perspective: 800px;
        }

        .carousel-track-3d {
            display: flex;
            align-items: center;
            overflow-x: auto;
            scroll-behavior: smooth;
            scroll-snap-type: x mandatory;
            padding: 1.5rem 0;
            gap: 0px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .carousel-track-3d::-webkit-scrollbar {
            display: none;
        }

        .dish-card-compact {
            flex: 0 0 108px;
            scroll-snap-align: center;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.35, 1);
            transform-style: preserve-3d;
            cursor: pointer;
            z-index: 1;
            padding: 0 4px;
        }

        .dish-image-box {
            position: relative;
            width: 100px;
            height: 108px;
            border-radius: 1.25rem;
            overflow: hidden;
            border: 1.5px solid rgba(107, 29, 47, 0.2);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.35, 1);
            background-color: #F4EFEA;
        }

        .dish-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .dish-burgundy-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, rgba(61, 10, 17, 0.88) 0%, rgba(88, 17, 26, 0.98) 100%);
            border-top: 1px solid rgba(250, 248, 245, 0.4);
            padding: 4px 2px;
            text-align: center;
            backdrop-filter: blur(4px);
        }

        .dish-card-compact.is-center {
            z-index: 30 !important;
            transform: scale(1.3) translateY(-8px) translateZ(40px) !important;
            opacity: 1 !important;
            filter: blur(0px) brightness(1) !important;
        }

        .dish-card-compact.is-center .dish-image-box {
            border: 3px solid #8c1a35 !important;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5), 
                        0 0 15px rgba(245, 158, 11, 0.5);
            border-radius: 1.4rem;
        }

        /* أنيميشن زر القائمة الدائري العائم (Circular Floating Menu Wheel) */
        .floating-menu-trigger {
            background: rgba(88, 17, 26, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(250, 248, 245, 0.4);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .floating-menu-trigger.is-active {
            transform: rotate(135deg) scale(1.1);
            background: rgba(140, 26, 53, 0.95);
        }

        .menu-items-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 2, 4, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 45;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
        }

        .menu-items-overlay.is-active {
            opacity: 1;
            pointer-events: auto;
        }

        .menu-item-bubble {
            transform: translateY(30px) scale(0.7);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .menu-items-overlay.is-active .menu-item-bubble {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .modal-fade-in {
            animation: modalFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.92) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .drawer-slide-in {
            animation: drawerSlideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes drawerSlideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
    </style>
</head>
<body class="relative min-h-screen pb-20 select-none">

    <!-- خلفية الصورة المستوردة مع التظليل الداكن بنسبة 0.5 -->
    <div class="custom-bg-image"></div>

    <!-- الهيدر الأفقـي الممتد والمضغوط الارتفاع -->
    <header class="relative w-full max-w-4xl mx-auto my-3 px-3">
        <div class="relative w-full rounded-2xl overflow-hidden shadow-2xl border border-offwhite/20 bg-burgundy-900/40 backdrop-blur-md px-4 py-2 sm:py-2.5">
            <div class="flex items-center justify-between gap-3">
                
                <!-- اليمين: اللوجو + اسم المطعم والتفاصيل -->
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-burgundy-950/70 border border-amber-300/60 flex items-center justify-center text-center backdrop-blur-md flex-shrink-0">
                        <i class="fas fa-ice-cream text-base text-amber-300"></i>
                    </div>

                    <div class="text-right text-offwhite">
                        <h1 class="text-base sm:text-xl font-bold tracking-wide text-amber-200 leading-none">
                            آيس هوم <span class="text-xs font-normal text-offwhite/80">| Ice Home</span>
                        </h1>
                        <p class="text-[11px] sm:text-xs text-gray-200/90 leading-tight mt-0.5">
                            عالم الفخامة والانتعاش
                        </p>
                    </div>
                </div>

                <!-- اليسار: حالة العمل والسلة -->
                <div class="flex items-center gap-2">
                    <button onclick="toggleCartDrawer()" class="relative glass-btn-ultra px-3 py-1.5 rounded-xl flex items-center gap-1.5 text-xs font-bold">
                        <i class="fas fa-shopping-bag text-amber-300"></i>
                        <span class="hidden sm:inline">السلة</span>
                        <span id="headerCartBadge" class="bg-red-600 text-white text-[9px] px-1.5 py-0.2 rounded-full font-bold">0</span>
                    </button>

                    <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-200 border border-emerald-400/30 backdrop-blur-md">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                        مفتوح
                    </span>
                </div>

            </div>
        </div>
    </header>

    <!-- شريط البحث وزر الكود زجاجي 80% -->
    <div class="sticky top-2 z-30 max-w-4xl mx-auto px-3 transition-all duration-300">
        <div class="bg-burgundy-900/30 backdrop-blur-md rounded-2xl p-2 flex items-center gap-2 shadow-lg border border-offwhite/20">
            <button onclick="toggleMenuView()" id="menuToggleButton" class="glass-btn-ultra font-bold px-3.5 py-1.5 rounded-xl text-xs flex items-center gap-1.5 whitespace-nowrap">
                <i class="fas fa-th-large text-xs" id="menuToggleIcon"></i>
                <span id="menuToggleText">عرض الأقسام</span>
            </button>
            
            <div class="relative flex-1">
                <input type="text" id="searchInput" oninput="handleSearch()" 
                       placeholder="ابحث عن مشروبك أو تحليتك..." 
                       class="w-full bg-offwhite/15 border border-offwhite/25 text-offwhite placeholder-offwhite/70 text-xs rounded-xl py-1.5 pr-8 pl-3 focus:outline-none focus:ring-2 focus:ring-amber-300 transition font-sans">
                <i class="fas fa-search absolute right-2.5 top-1/2 -translate-y-1/2 text-amber-300 text-xs"></i>
            </div>
        </div>
    </div>

    <!-- قسم الترحيب بآلة الكتابة بخط الرقعة -->
    <div id="homeContentSection" class="max-w-3xl mx-auto px-4 py-16 relative z-10 text-center flex flex-col items-center justify-center min-h-[50vh]">
        <div class="space-y-4">
            <h2 id="typewriterTitle" class="text-4xl sm:text-6xl font-bold ruqaa-title-arabic"></h2>
            <h1 id="typewriterSubtitle" class="text-2xl sm:text-5xl font-bold ruqaa-title-english"></h1>
        </div>
    </div>

    <!-- Main Categories Container (الأقسام المفتوحة) -->
    <main class="max-w-4xl mx-auto px-3 py-6 relative z-10 space-y-4 hidden" id="accordionContainer">
        <!-- Injected via JS -->
    </main>

    <!-- الطبقة المتغوشة وتصميم دوائر الأقسام التفاعلية (Floating Circle Menu) -->
    <div id="menuItemsOverlay" class="menu-items-overlay flex flex-col items-center justify-center p-4">
        <div class="text-center mb-6">
            <h3 class="text-2xl font-bold text-amber-200 tracking-wider">قائمة الأقسام الرئيسية</h3>
            <p class="text-xs text-offwhite/80 mt-1">اختر القسم للتصفح المباشر</p>
        </div>

        <div id="circleMenuGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-5 max-w-lg w-full px-4">
            <!-- Injected via JS -->
        </div>
    </div>

    <!-- الزر الدائري العائم المخصص للمنيو في الأسفل (Floating Circle Menu Trigger) -->
    <div class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50">
        <button id="floatingMenuTrigger" onclick="toggleCircleMenuWheel()" class="floating-menu-trigger w-14 h-14 rounded-full text-amber-300 flex items-center justify-center text-xl transition transform active:scale-90">
            <i class="fas fa-utensils"></i>
        </button>
    </div>

    <!-- Dish Customization Modal (نافذة تفاصيل الوجبة) -->
    <div id="dishModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-burgundy-950/75 backdrop-blur-sm transition-opacity">
        <div class="bg-offwhite text-burgundy-900 w-full max-w-lg rounded-3xl overflow-hidden shadow-2xl modal-fade-in max-h-[92vh] flex flex-col border border-burgundy-700/20">
            
            <div class="relative h-48 sm:h-56 overflow-hidden bg-burgundy-900">
                <img id="modalImage" src="" alt="Dish Detail" class="w-full h-full object-cover">
                <button onclick="closeDishModal()" class="absolute top-3 left-3 w-8 h-8 rounded-full glass-btn-ultra flex items-center justify-center">
                    <i class="fas fa-times text-xs"></i>
                </button>
                <div class="absolute bottom-3 right-3 bg-burgundy-900/90 backdrop-blur-md px-3 py-1 rounded-full text-amber-300 text-xs font-bold border border-amber-300/30" id="modalCategoryBadge">
                    قسم المشروبات
                </div>
            </div>

            <div class="p-5 overflow-y-auto flex-1 space-y-4 text-right">
                <div class="flex justify-between items-start gap-2">
                    <div>
                        <h3 id="modalTitle" class="text-xl font-bold text-burgundy-900"></h3>
                        <p id="modalDesc" class="text-xs text-burgundy-800/80 mt-1 leading-relaxed font-sans"></p>
                    </div>
                    <span id="modalPrice" class="text-base font-bold text-burgundy-700 whitespace-nowrap bg-burgundy-50 border border-burgundy-200 px-3 py-1 rounded-xl font-sans"></span>
                </div>

                <div id="optionsContainer" class="space-y-2 pt-2 border-t border-burgundy-100">
                    <label class="block text-xs font-bold text-burgundy-900">الحجم / الخيار:</label>
                    <div id="sizeOptionsGrid" class="grid grid-cols-2 gap-2 font-sans"></div>
                </div>

                <div id="extrasContainer" class="space-y-2 pt-2 border-t border-burgundy-100">
                    <label class="block text-xs font-bold text-burgundy-900">إضافات اختيارية:</label>
                    <div id="extrasGrid" class="space-y-1.5 font-sans"></div>
                </div>

                <div class="pt-2 border-t border-burgundy-100">
                    <label for="specialNote" class="block text-xs font-bold text-burgundy-900 mb-1">ملاحظات خاصة (سكر أقل، بدون ثلج، إلخ):</label>
                    <textarea id="specialNote" rows="2" placeholder="اكتب تفضيلاتك..." class="w-full text-xs p-3 rounded-xl border border-burgundy-200 focus:outline-none focus:ring-1 focus:ring-burgundy-700 bg-white text-burgundy-900 placeholder-burgundy-300 font-sans"></textarea>
                </div>
            </div>

            <div class="p-4 bg-burgundy-50 border-t border-burgundy-100 flex items-center justify-between gap-4">
                <div class="flex items-center border border-burgundy-200 rounded-full bg-white px-2 py-1">
                    <button onclick="changeModalQty(-1)" class="w-7 h-7 rounded-full text-burgundy-800 font-bold transition">-</button>
                    <span id="modalQty" class="w-7 text-center font-bold text-xs text-burgundy-900 font-sans">1</span>
                    <button onclick="changeModalQty(1)" class="w-7 h-7 rounded-full text-burgundy-800 font-bold transition">+</button>
                </div>

                <button onclick="confirmAddToCart()" class="flex-1 glass-btn-burgundy bg-burgundy-800 font-bold py-2.5 px-4 rounded-full text-xs sm:text-sm flex items-center justify-center gap-2 shadow-lg">
                    <i class="fas fa-shopping-bag text-amber-300"></i>
                    <span>إضافة للسلة • </span>
                    <span id="modalTotalPrice" class="font-sans">0 ر.س</span>
                </button>
            </div>

        </div>
    </div>

    <!-- Cart Drawer (سلة الطلبات) -->
    <div id="cartDrawer" class="fixed inset-0 z-50 hidden flex justify-end bg-burgundy-950/75 backdrop-blur-sm transition-opacity">
        <div class="bg-offwhite text-burgundy-900 w-full max-w-md h-full shadow-2xl flex flex-col justify-between transform drawer-slide-in border-l border-burgundy-200">
            <div class="p-4 bg-burgundy-800 text-offwhite flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i class="fas fa-shopping-basket text-amber-300 text-base"></i>
                    <h3 class="font-bold text-sm">سلة الطلبات - ايس هوم</h3>
                </div>
                <button onclick="toggleCartDrawer()" class="w-7 h-7 rounded-full glass-btn-ultra flex items-center justify-center"><i class="fas fa-times text-xs"></i></button>
            </div>

            <div id="cartItemsContainer" class="p-4 overflow-y-auto flex-1 space-y-3 divide-y divide-burgundy-100 text-right"></div>

            <div class="p-4 bg-burgundy-50 border-t border-burgundy-200 space-y-3">
                <div class="space-y-1 text-xs text-burgundy-900 font-sans">
                    <div class="flex justify-between"><span>المجموع الفرعي:</span><span id="subTotalText" class="font-bold text-burgundy-800">0 ر.س</span></div>
                    <div class="flex justify-between text-[10px] text-burgundy-600"><span>ضريبة القيمة المضافة (15%):</span><span>شاملة</span></div>
                    <div class="flex justify-between text-sm font-bold text-burgundy-900 border-t border-burgundy-200 pt-2"><span>المجموع الكلي:</span><span id="grandTotalText">0 ر.س</span></div>
                </div>

                <div class="grid grid-cols-2 gap-2 pt-1">
                    <button onclick="sendOrderWhatsApp()" class="glass-btn-ultra bg-emerald-600/30 text-emerald-900 font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 border-emerald-500/40">
                        <i class="fab fa-whatsapp text-sm text-emerald-700"></i> <span class="text-burgundy-900">إرسال للواتساب</span>
                    </button>
                    <button onclick="showReceiptModal()" class="glass-btn-burgundy font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2">
                        <i class="fas fa-file-invoice text-sm text-amber-300"></i> <span>الفاتورة الرقمية</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Notification Box -->
    <div id="customNotification" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 hidden bg-burgundy-900/90 text-amber-200 px-5 py-2.5 rounded-2xl shadow-2xl border border-amber-300/30 text-xs font-bold flex items-center gap-2.5 backdrop-blur-md transition-all duration-300">
        <i class="fas fa-check-circle text-amber-300 text-sm"></i>
        <span id="notificationText">تمت العملية بنجاح</span>
    </div>

    <script>
        const categories = [
            { id: 'iced-drinks', name: 'المشروبات البارده', icon: 'fa-glass-martini-alt' },
            { id: 'ice-cream', name: 'الآيس كريم والجيلاتو', icon: 'fa-ice-cream' },
            { id: 'hot-drinks', name: 'المشروبات الساخنه', icon: 'fa-mug-hot' },
            { id: 'mojitos', name: 'الموهيتو والانتعاش', icon: 'fa-cocktail' },
            { id: 'waffles', name: 'الوافل والبان كيك', icon: 'fa-stroopwafel' },
            { id: 'desserts', name: 'الحلويات الفاخرة', icon: 'fa-cheese' }
        ];

        const menuItems = [

            { id: 24, categoryId: 'desserts', name: 'تشيز كيك التوت الأزرق', desc: 'قاعدة بسكويت هشة مع كريمة التوت', price: 28, tag: 'مميز', image: 'https://images.unsplash.com/photo-1524351199678-941a58a3df50?auto=format&fit=crop&w=400&q=80', sizes: [{ name: 'قطعة', price: 0 }], extras: [] }
        ];

        let currentSearchQuery = '';
        let openCategoryId = 'iced-drinks';
        let cart = [];
        let selectedItemForModal = null;
        let selectedSizePrice = 0;
        let selectedOptionName = '';
        let selectedExtras = [];
        let modalQuantity = 1;
        let isMenuVisible = false;
        let isCircleMenuOpen = false;

        window.onload = function() {
            renderCircleMenuGrid();
            renderAccordionMenu();
            startTypewriterEffect();
        };

        // تأثير آلة الكتابة بخط الرقعة
        function startTypewriterEffect() {
            const text1 = "أهلاً وسهلاً بكم";
            const text2 = "Ice Home";
            
            typeWriterText("typewriterTitle", text1, 100, () => {
                setTimeout(() => {
                    typeWriterText("typewriterSubtitle", text2, 120, null);
                }, 300);
            });
        }

        function typeWriterText(elementId, text, speed, callback) {
            let i = 0;
            const el = document.getElementById(elementId);
            if (!el) return;
            el.innerHTML = "";
            function type() {
                if (i < text.length) {
                    el.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                } else if (callback) {
                    callback();
                }
            }
            type();
        }

        function toggleCircleMenuWheel() {
            isCircleMenuOpen = !isCircleMenuOpen;
            const trigger = document.getElementById('floatingMenuTrigger');
            const overlay = document.getElementById('menuItemsOverlay');

            if (isCircleMenuOpen) {
                trigger.classList.add('is-active');
                overlay.classList.add('is-active');
            } else {
                trigger.classList.remove('is-active');
                overlay.classList.remove('is-active');
            }
        }

        function selectCategoryFromWheel(catId) {
            toggleCircleMenuWheel();
            if (!isMenuVisible) {
                toggleMenuView();
            }
            toggleAccordion(catId);
        }

        function renderCircleMenuGrid() {
            const container = document.getElementById('circleMenuGrid');
            container.innerHTML = categories.map((cat, index) => `
                <div class="menu-item-bubble flex flex-col items-center gap-2 cursor-pointer group" 
                     style="transition-delay: ${index * 60}ms;" 
                     onclick="selectCategoryFromWheel('${cat.id}')">
                    <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-burgundy-900/80 border-2 border-amber-300/80 flex items-center justify-center text-amber-300 text-xl sm:text-2xl shadow-2xl group-hover:scale-110 group-hover:bg-burgundy-800 transition backdrop-blur-md">
                        <i class="fas ${cat.icon}"></i>
                    </div>
                    <span class="text-xs sm:text-sm font-bold text-offwhite text-center leading-tight tracking-wide group-hover:text-amber-200 transition">
                        ${cat.name}
                    </span>
                </div>
            `).join('');
        }

        function toggleMenuView() {
            isMenuVisible = !isMenuVisible;
            const homeSection = document.getElementById('homeContentSection');
            const menuSection = document.getElementById('accordionContainer');
            const toggleText = document.getElementById('menuToggleText');
            const toggleIcon = document.getElementById('menuToggleIcon');

            if (isMenuVisible) {
                homeSection.classList.add('hidden');
                menuSection.classList.remove('hidden');
                toggleText.innerText = 'الرئيسية والترحيب';
                toggleIcon.classList.remove('fa-th-large');
                toggleIcon.classList.add('fa-home');
            } else {
                homeSection.classList.remove('hidden');
                menuSection.classList.add('hidden');
                toggleText.innerText = 'عرض الأقسام';
                toggleIcon.classList.remove('fa-home');
                toggleIcon.classList.add('fa-th-large');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderAccordionMenu() {
            const container = document.getElementById('accordionContainer');

            container.innerHTML = categories.map(cat => {
                const items = menuItems.filter(item => {
                    const matchesCat = item.categoryId === cat.id;
                    const matchesSearch = item.name.includes(currentSearchQuery) || item.desc.includes(currentSearchQuery);
                    return matchesCat && matchesSearch;
                });

                if (items.length === 0 && currentSearchQuery) return '';

                const isOpen = cat.id === openCategoryId || (currentSearchQuery !== '' && items.length > 0);

                return `
                    <div class="category-integrated-card ${isOpen ? 'is-open' : ''}" id="accordion-${cat.id}">
                        <button onclick="toggleAccordion('${cat.id}')" 
                                class="w-full py-3.5 px-6 flex items-center justify-between text-center transition">
                            <div class="w-6"></div>
                            <h2 class="text-base sm:text-lg font-bold text-burgundy-900 tracking-wide">
                                ${cat.name}
                            </h2>
                            <i class="fas fa-chevron-down text-burgundy-800 text-xs transition-transform duration-500 ${isOpen ? 'rotate-180' : ''}"></i>
                        </button>

                        <div id="content-${cat.id}" class="expanded-dishes-wrapper">
                            <div class="carousel-wrapper-3d">
                                <div class="carousel-track-3d" id="track-${cat.id}" onscroll="update3DPerspective('${cat.id}')">
                                    <div class="flex-shrink-0 w-[42vw]"></div>
                                    ${items.map(item => renderCompactImageDishCard(item)).join('')}
                                    <div class="flex-shrink-0 w-[42vw]"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            categories.forEach(cat => {
                const card = document.getElementById(`accordion-${cat.id}`);
                const content = document.getElementById(`content-${cat.id}`);
                if (card && content && card.classList.contains('is-open')) {
                    content.style.maxHeight = '230px';
                    setTimeout(() => update3DPerspective(cat.id), 120);
                }
            });
        }

        function renderCompactImageDishCard(item) {
            return `
                <div class="dish-card-compact" data-id="${item.id}" onclick="openDishModal(${item.id})">
                    <div class="dish-image-box">
                        <img src="${item.image}" alt="${item.name}" loading="lazy">
                        <div class="dish-burgundy-label">
                            <h4 class="font-bold text-amber-200 text-[9px] truncate px-1">${item.name}</h4>
                            <span class="text-[8px] font-bold text-white block leading-none mt-0.5 font-sans">${item.price} ر.س</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function update3DPerspective(catId) {
            const track = document.getElementById(`track-${catId}`);
            if (!track) return;

            const cards = Array.from(track.querySelectorAll('.dish-card-compact'));
            const trackCenter = track.getBoundingClientRect().left + track.offsetWidth / 2;

            let closestCard = null;
            let minDistance = Infinity;

            cards.forEach(card => {
                const cardCenter = card.getBoundingClientRect().left + card.getBoundingClientRect().width / 2;
                const distance = Math.abs(trackCenter - cardCenter);
                if (distance < minDistance) {
                    minDistance = distance;
                    closestCard = card;
                }
            });

            const centerIndex = cards.indexOf(closestCard);

            cards.forEach((card, index) => {
                card.classList.remove('is-center', 'is-side-1', 'is-far');

                if (index === centerIndex) {
                    card.classList.add('is-center');
                } else if (Math.abs(index - centerIndex) === 1) {
                    card.classList.add('is-side-1');
                } else {
                    card.classList.add('is-far');
                }
            });
        }

        function toggleAccordion(catId) {
            if (!isMenuVisible) {
                toggleMenuView();
            }

            const isSame = openCategoryId === catId;
            openCategoryId = isSame ? null : catId;

            categories.forEach(c => {
                const card = document.getElementById(`accordion-${c.id}`);
                const content = document.getElementById(`content-${c.id}`);
                const icon = card?.querySelector('.fa-chevron-down');

                if (card && content) {
                    if (c.id === openCategoryId) {
                        card.classList.add('is-open');
                        content.style.maxHeight = '230px';
                        icon?.classList.add('rotate-180');
                        setTimeout(() => update3DPerspective(c.id), 200);
                    } else {
                        card.classList.remove('is-open');
                        content.style.maxHeight = '0px';
                        icon?.classList.remove('rotate-180');
                    }
                }
            });

            if (openCategoryId) {
                setTimeout(() => {
                    const activeElem = document.getElementById(`accordion-${openCategoryId}`);
                    if (activeElem) {
                        activeElem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                }, 250);
            }
        }

        function handleSearch() {
            if (!isMenuVisible) {
                toggleMenuView();
            }
            currentSearchQuery = document.getElementById('searchInput').value.trim();
            renderAccordionMenu();
        }

        function openDishModal(id) {
            selectedItemForModal = menuItems.find(i => i.id === id);
            if (!selectedItemForModal) return;

            modalQuantity = 1;
            selectedSizePrice = 0;
            selectedOptionName = selectedItemForModal.sizes[0]?.name || '';
            selectedExtras = [];

            document.getElementById('modalImage').src = selectedItemForModal.image;
            document.getElementById('modalTitle').innerText = selectedItemForModal.name;
            document.getElementById('modalDesc').innerText = selectedItemForModal.desc;
            document.getElementById('modalPrice').innerText = `${selectedItemForModal.price} ر.س`;
            document.getElementById('modalQty').innerText = modalQuantity;
            document.getElementById('specialNote').value = '';

            const sizeContainer = document.getElementById('sizeOptionsGrid');
            if (selectedItemForModal.sizes && selectedItemForModal.sizes.length > 0) {
                document.getElementById('optionsContainer').classList.remove('hidden');
                sizeContainer.innerHTML = selectedItemForModal.sizes.map((s, idx) => `
                    <label class="cursor-pointer border rounded-xl p-2.5 flex items-center justify-between text-xs transition ${idx === 0 ? 'border-burgundy-700 bg-burgundy-50 font-bold text-burgundy-900' : 'border-burgundy-200 text-burgundy-800'}" onclick="selectSize(${s.price}, '${s.name}', this)">
                        <span>${s.name}</span>
                        <span class="text-burgundy-600">${s.price > 0 ? `+${s.price} ر.س` : 'أساسي'}</span>
                    </label>
                `).join('');
            } else {
                document.getElementById('optionsContainer').classList.add('hidden');
            }

            const extrasContainer = document.getElementById('extrasGrid');
            if (selectedItemForModal.extras && selectedItemForModal.extras.length > 0) {
                document.getElementById('extrasContainer').classList.remove('hidden');
                extrasContainer.innerHTML = selectedItemForModal.extras.map(e => `
                    <label class="cursor-pointer border border-burgundy-200 rounded-xl p-2 flex items-center justify-between text-xs hover:bg-burgundy-50 text-burgundy-900">
                        <div class="flex items-center gap-2">
                            <input type="checkbox" onchange="toggleExtra('${e.name}', ${e.price}, this)" class="accent-burgundy-700 w-4 h-4 rounded">
                            <span>${e.name}</span>
                        </div>
                        <span class="text-burgundy-700 font-bold">+${e.price} ر.س</span>
                    </label>
                `).join('');
            } else {
                document.getElementById('extrasContainer').classList.add('hidden');
            }

            updateModalTotalPrice();
            document.getElementById('dishModal').classList.remove('hidden');
        }

        function closeDishModal() {
            document.getElementById('dishModal').classList.add('hidden');
        }

        function selectSize(price, name, el) {
            selectedSizePrice = price;
            selectedOptionName = name;
            const siblings = el.parentElement.children;
            for (let child of siblings) {
                child.classList.remove('border-burgundy-700', 'bg-burgundy-50', 'font-bold', 'text-burgundy-900');
                child.classList.add('border-burgundy-200', 'text-burgundy-800');
            }
            el.classList.add('border-burgundy-700', 'bg-burgundy-50', 'font-bold', 'text-burgundy-900');
            el.classList.remove('text-burgundy-800');
            updateModalTotalPrice();
        }

        function toggleExtra(name, price, checkbox) {
            if (checkbox.checked) {
                selectedExtras.push({ name, price });
            } else {
                selectedExtras = selectedExtras.filter(e => e.name !== name);
            }
            updateModalTotalPrice();
        }

        function changeModalQty(delta) {
            modalQuantity = Math.max(1, modalQuantity + delta);
            document.getElementById('modalQty').innerText = modalQuantity;
            updateModalTotalPrice();
        }

        function updateModalTotalPrice() {
            if (!selectedItemForModal) return;
            const extrasTotal = selectedExtras.reduce((sum, e) => sum + e.price, 0);
            const unitPrice = selectedItemForModal.price + selectedSizePrice + extrasTotal;
            const total = unitPrice * modalQuantity;
            document.getElementById('modalTotalPrice').innerText = `${total} ر.س`;
        }

        function confirmAddToCart() {
            const note = document.getElementById('specialNote').value.trim();
            const extrasTotal = selectedExtras.reduce((sum, e) => sum + e.price, 0);
            const unitPrice = selectedItemForModal.price + selectedSizePrice + extrasTotal;

            const cartItem = {
                cartId: Date.now(),
                itemId: selectedItemForModal.id,
                name: selectedItemForModal.name,
                option: selectedOptionName,
                extras: selectedExtras.map(e => e.name).join(', '),
                note: note,
                unitPrice: unitPrice,
                qty: modalQuantity,
                totalPrice: unitPrice * modalQuantity
            };

            cart.push(cartItem);
            closeDishModal();
            updateCartUI();
            showNotification('تمت إضافة الطلب للسلة بنجاح ✨');
        }

        function updateCartUI() {
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('headerCartBadge').innerText = totalItems;
            renderCartDrawerItems();
        }

        function toggleCartDrawer() {
            const drawer = document.getElementById('cartDrawer');
            drawer.classList.toggle('hidden');
        }

        function renderCartDrawerItems() {
            const container = document.getElementById('cartItemsContainer');
            const subTotalText = document.getElementById('subTotalText');
            const grandTotalText = document.getElementById('grandTotalText');

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-burgundy-300">
                        <i class="fas fa-shopping-basket text-3xl mb-3 text-burgundy-200"></i>
                        <p class="text-xs font-bold text-burgundy-700">سلتك فارغة حالياً</p>
                    </div>
                `;
                subTotalText.innerText = '0 ر.س';
                grandTotalText.innerText = '0 ر.س';
                return;
            }

            const grandTotal = cart.reduce((sum, item) => sum + item.totalPrice, 0);
            subTotalText.innerText = `${grandTotal} ر.س`;
            grandTotalText.innerText = `${grandTotal} ر.س`;

            container.innerHTML = cart.map(item => `
                <div class="pt-3 first:pt-0 flex items-center justify-between gap-2 text-burgundy-900">
                    <div class="flex-1">
                        <h4 class="font-bold text-burgundy-900 text-xs">${item.name}</h4>
                        <div class="text-[10px] text-burgundy-600 mt-0.5 font-sans">
                            ${item.option ? `<span>الخيار: ${item.option}</span>` : ''}
                            ${item.extras ? `<span class="block">إضافات: ${item.extras}</span>` : ''}
                            ${item.note ? `<span class="block text-amber-700">ملاحظة: ${item.note}</span>` : ''}
                        </div>
                        <span class="font-bold text-burgundy-700 text-xs mt-1 block font-sans">${item.totalPrice} ر.س</span>
                    </div>

                    <div class="flex items-center gap-2">
                        <div class="flex items-center border border-burgundy-200 rounded-lg bg-burgundy-50 font-sans">
                            <button onclick="updateCartItemQty(${item.cartId}, -1)" class="w-6 h-6 text-xs font-bold text-burgundy-800">-</button>
                            <span class="text-xs font-bold w-5 text-center text-burgundy-900">${item.qty}</span>
                            <button onclick="updateCartItemQty(${item.cartId}, 1)" class="w-6 h-6 text-xs font-bold text-burgundy-800">+</button>
                        </div>
                        <button onclick="removeCartItem(${item.cartId})" class="text-rose-500 hover:text-rose-700 p-1 transition">
                            <i class="fas fa-trash-alt text-xs"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function updateCartItemQty(cartId, delta) {
            const item = cart.find(i => i.cartId === cartId);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) {
                cart = cart.filter(i => i.cartId !== cartId);
            } else {
                item.totalPrice = item.unitPrice * item.qty;
            }
            updateCartUI();
        }

        function removeCartItem(cartId) {
            cart = cart.filter(i => i.cartId !== cartId);
            updateCartUI();
        }

        function sendOrderWhatsApp() {
            if (cart.length === 0) return;

            let msg = `*طلب جديد من منيو ايس هوم 🍦☕*\n\n`;
            cart.forEach((item, index) => {
                msg += `${index + 1}. *${item.name}* (العدد: ${item.qty})\n`;
                if (item.option) msg += `   • الحجم: ${item.option}\n`;
                if (item.extras) msg += `   • الإضافات: ${item.extras}\n`;
                if (item.note) msg += `   • ملاحظة: ${item.note}\n`;
                msg += `   • السعر: ${item.totalPrice} ر.س\n\n`;
            });

            const total = cart.reduce((s, i) => s + i.totalPrice, 0);
            msg += `*إجمالي الطلب:* ${total} ر.س\n`;
            msg += `شكراً لاختياركم ايس هوم! ❤️`;

            const encoded = encodeURIComponent(msg);
            window.open(`https://wa.me/966500000000?text=${encoded}`, '_blank');
        }

        function showReceiptModal() {
            if (cart.length === 0) return;
            const total = cart.reduce((s, i) => s + i.totalPrice, 0);
            showNotification(`إجمالي الفاتورة الرقمية: ${total} ر.س — جاهزة للطلب`);
        }

        function showNotification(text) {
            const notif = document.getElementById('customNotification');
            document.getElementById('notificationText').innerText = text;
            notif.classList.remove('hidden', 'opacity-0');
            setTimeout(() => {
                notif.classList.add('opacity-0');
                setTimeout(() => notif.classList.add('hidden'), 300);
            }, 3000);
        }
    </script>
</body>
</html>
