<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoverFlow Gallery - مفرغ الخلفية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-drag: none;
        }

        body {
            background: transparent;
            min-height: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: visible;
            perspective: 1000px;
        }

        /* Coverflow Container */
        .coverflow-container {
            position: relative;
            width: 100%;
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            cursor: grab;
        }

        .coverflow-container:active {
            cursor: grabbing;
        }

        .coverflow-wrapper {
            position: relative;
            width: 280px;
            height: 360px;
            transform-style: preserve-3d;
        }

        /* Card Styles - مفرغ بدون خلفيات أو حد إضافي */
        .card {
            position: absolute;
            width: 280px;
            height: 360px;
            border-radius: 20px;
            overflow: hidden;
            background: transparent;
            /* إسقاط ظل ناعم على الصورة نفسها لإعطائها عمق 3D */
            filter: drop-shadow(0px 15px 25px rgba(0, 0, 0, 0.35));
            transition: transform 0.55s cubic-bezier(0.25, 1, 0.5, 1), 
                        filter 0.55s ease, 
                        opacity 0.55s ease;
            transform-origin: center center;
            will-change: transform, filter;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            display: block;
            pointer-events: none;
        }

        /* Fallback UI */
        .card-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 3rem;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.05);
        }

        /* Opening Animation Class */
        .opening .card {
            animation: openingAnim 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes openingAnim {
            0% {
                transform: translate3d(0, 80px, -400px) rotateY(0deg) scale(0.5);
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        /* Navigation Dots */
        .dots-container {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.25);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dot.active {
            background: #000000;
            transform: scale(1.4);
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <div class="coverflow-container" id="coverflow">
        <div class="coverflow-wrapper opening" id="wrapper">
            <!-- سيتم توليد البطاقات عبر JavaScript -->
        </div>
    </div>

    <div class="dots-container" id="dots"></div>

    <script>
        const imageData = [
            { url: "https://images.pexels.com/photos/220453/pexels-photo-220453.jpeg?auto=compress&cs=tinysrgb&w=800", title: "صورة 1" },
            { url: "https://images.pexels.com/photos/2726111/pexels-photo-2726111.jpeg?auto=compress&cs=tinysrgb&w=800", title: "صورة 2" },
            { url: "https://images.pexels.com/photos/91227/pexels-photo-91227.jpeg?auto=compress&cs=tinysrgb&w=800", title: "صورة 3" },
            { url: "https://images.pexels.com/photos/774909/pexels-photo-774909.jpeg?auto=compress&cs=tinysrgb&w=800", title: "صورة 4" },
            { url: "https://images.pexels.com/photos/1681010/pexels-photo-1681010.jpeg?auto=compress&cs=tinysrgb&w=800", title: "صورة 5" }
        ];

        const wrapper = document.getElementById('wrapper');
        const container = document.getElementById('coverflow');
        const dotsContainer = document.getElementById('dots');

        let currentIndex = 2;
        let isDragging = false;
        let startX = 0;

        function initGallery() {
            wrapper.innerHTML = '';
            dotsContainer.innerHTML = '';

            imageData.forEach((data, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = index;

                const img = document.createElement('img');
                img.src = data.url;
                img.alt = data.title;
                img.loading = "eager";

                img.onerror = function() {
                    this.remove();
                    const fallback = document.createElement('div');
                    fallback.className = 'card-fallback';
                    fallback.innerHTML = `🖼️`;
                    card.appendChild(fallback);
                };

                card.appendChild(img);
                wrapper.appendChild(card);

                const dot = document.createElement('div');
                dot.className = `dot ${index === currentIndex ? 'active' : ''}`;
                dot.addEventListener('click', () => goToIndex(index));
                dotsContainer.appendChild(dot);

                card.addEventListener('click', () => {
                    if (index !== currentIndex) {
                        goToIndex(index);
                    }
                });
            });

            updateCoverflow();

            setTimeout(() => {
                wrapper.classList.remove('opening');
            }, 1200);
        }

        function updateCoverflow() {
            const cards = wrapper.querySelectorAll('.card');
            const dots = dotsContainer.querySelectorAll('.dot');

            cards.forEach((card, index) => {
                const offset = index - currentIndex;
                
                if (offset === 0) {
                    card.style.transform = `translateX(0px) translateZ(180px) rotateY(0deg)`;
                    card.style.filter = 'brightness(1) drop-shadow(0px 15px 25px rgba(0, 0, 0, 0.35))';
                    card.style.opacity = '1';
                    card.style.zIndex = '10';
                } else {
                    const direction = offset > 0 ? 1 : -1;
                    const distance = Math.abs(offset);
                    
                    const translateX = direction * (130 + distance * 35);
                    const translateZ = -100 * distance;
                    const rotateY = -direction * 45;
                    const brightness = Math.max(0.3, 1 - distance * 0.3);
                    const opacity = distance > 3 ? 0 : 1;

                    card.style.transform = `translateX(${translateX}px) translateZ(${translateZ}px) rotateY(${rotateY}deg)`;
                    card.style.filter = `brightness(${brightness}) drop-shadow(0px 10px 15px rgba(0, 0, 0, 0.2))`;
                    card.style.opacity = opacity;
                    card.style.zIndex = 10 - distance;
                }
            });

            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentIndex);
            });
        }

        function goToIndex(index) {
            if (index >= 0 && index < imageData.length) {
                currentIndex = index;
                updateCoverflow();
            }
        }

        // Mouse Drag
        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const diffX = e.clientX - startX;
            if (Math.abs(diffX) > 45) {
                if (diffX > 0 && currentIndex > 0) {
                    goToIndex(currentIndex - 1);
                    startX = e.clientX;
                } else if (diffX < 0 && currentIndex < imageData.length - 1) {
                    goToIndex(currentIndex + 1);
                    startX = e.clientX;
                }
            }
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Touch Swiping
        container.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches[0].clientX;
        });

        container.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const diffX = e.touches[0].clientX - startX;
            if (Math.abs(diffX) > 35) {
                if (diffX > 0 && currentIndex > 0) {
                    goToIndex(currentIndex - 1);
                    startX = e.touches[0].clientX;
                } else if (diffX < 0 && currentIndex < imageData.length - 1) {
                    goToIndex(currentIndex + 1);
                    startX = e.touches[0].clientX;
                }
            }
        });

        container.addEventListener('touchend', () => {
            isDragging = false;
        });

        // Wheel Scroll
        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.deltaY > 0 || e.deltaX > 0) {
                if (currentIndex < imageData.length - 1) goToIndex(currentIndex + 1);
            } else {
                if (currentIndex > 0) goToIndex(currentIndex - 1);
            }
        }, { passive: false });

        // Keyboard Navigation
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
                if (currentIndex > 0) goToIndex(currentIndex - 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
                if (currentIndex < imageData.length - 1) goToIndex(currentIndex + 1);
            }
        });

        initGallery();
    </script>
</body>
</html>
