<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ايس هوم | Ice Home - القائمة الرقمية الفاخرة</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Cairo & Aref Ruqaa & Fredoka -->
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@400;600;700;900&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        burgundy: {
                            50: '#fcf2f4',
                            100: '#f6dbe0',
                            200: '#ebaac2',
                            600: '#8c1a35',
                            700: '#6b1d2f',
                            800: '#58111a',
                            900: '#3d0a11',
                        },
                        offwhite: {
                            DEFAULT: '#FAF8f5',
                            card: '#FFFDF9',
                            soft: '#F4EFEA',
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        ruqaa: ['Aref Ruqaa', 'serif'],
                        english: ['Fredoka', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #FAF8f5;
            color: #FAF8f5;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* خلفية الصورة المستوردة مع طبقة داكنة */
        .custom-bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://raw.githubusercontent.com/workmemo2007-gif/J/d40a2080aeb7b9c4ff515579cf26f7fed990e385/IMG_2730.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .ruqaa-welcome-text {
            font-family: 'Aref Ruqaa', serif;
            color: #FAF8f5;
            text-shadow: 0 0 12px rgba(250, 248, 245, 0.9), 
                         0 0 25px rgba(250, 248, 245, 0.6), 
                         0 0 35px rgba(245, 158, 11, 0.4);
            letter-spacing: 1px;
        }

        .ruqaa-welcome-english {
            font-family: 'Fredoka', sans-serif;
            color: #FAF8f5;
            text-shadow: 0 0 10px rgba(250, 248, 245, 0.8), 
                         0 0 20px rgba(245, 158, 11, 0.5);
            letter-spacing: 2px;
        }

        /* زجاج برغندي ناصع الشفافية */
        .burgundy-light-glass {
            background: rgba(140, 26, 53, 0.12) !important;
            backdrop-filter: blur(16px) !important;
            -webkit-backdrop-filter: blur(16px) !important;
            border: 1px solid rgba(250, 248, 245, 0.35) !important;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25) !important;
            color: #FAF8f5 !important;
        }

        .vertical-cards-perspective-wrapper {
            perspective: 1000px;
            width: 100%;
        }

        .vertical-cards-carousel-track {
            display: flex;
            align-items: center;
            overflow-x: auto;
            scroll-behavior: smooth;
            scroll-snap-type: x mandatory;
            padding: 2.5rem 0;
            gap: 1.25rem;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .vertical-cards-carousel-track::-webkit-scrollbar {
            display: none;
        }

        .large-vertical-dish-card {
            flex: 0 0 280px;
            scroll-snap-align: center;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            cursor: pointer;
            z-index: 1;
            opacity: 0.7;
            filter: blur(1px) brightness(0.85);
            transform: scale(0.88) translateZ(-40px);
        }

        .large-vertical-dish-card.is-center {
            z-index: 30 !important;
            opacity: 1 !important;
            filter: blur(0px) brightness(1) !important;
            transform: scale(1.05) translateY(-10px) translateZ(50px) !important;
        }

        .right-glass-menu-trigger {
            background: rgba(140, 26, 53, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(250, 248, 245, 0.4);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .right-glass-menu-trigger.is-active {
            transform: rotate(135deg) scale(1.1);
            background: rgba(140, 26, 53, 0.55);
            border-color: rgba(245, 158, 11, 0.8);
        }

        .blur-only-overlay {
            position: fixed;
            inset: 0;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            z-index: 45;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
        }

        .blur-only-overlay.is-active {
            opacity: 1;
            pointer-events: auto;
        }

        .vertical-categories-stack {
            position: fixed;
            bottom: 8.5rem;
            right: 1.5rem;
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            pointer-events: none;
        }

        .category-bubble-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            opacity: 0;
            transform: translateY(25px) scale(0.8);
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .blur-only-overlay.is-active ~ .vertical-categories-stack .category-bubble-item {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .modal-fade-in {
            animation: modalFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.92) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .drawer-slide-in {
            animation: drawerSlideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes drawerSlideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
    </style>
</head>
<body class="relative min-h-screen pb-32 select-none">

    <!-- خلفية الصورة المستوردة -->
    <div class="custom-bg-image"></div>

    <!-- الهيدر الأفقـي (يختفي عند فتح أي قسم) -->

            <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-3 cursor-pointer" onclick="goToHomeView()">
                    <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl burgundy-light-glass flex items-center justify-center text-center flex-shrink-0 border border-amber-300/40">
                        <i class="fas fa-ice-cream text-lg text-amber-300"></i>
                    </div>
                    <div class="text-right text-offwhite">
                        <h1 class="text-base sm:text-xl font-extrabold tracking-wide text-amber-200 leading-none">
                            آيس هوم <span class="text-xs font-normal text-offwhite/80">| Ice Home</span>
                        </h1>
                        <p class="text-[11px] sm:text-xs text-gray-200/90 leading-tight mt-1">
                            عالم الفخامة والانتعاش
                        </p>
                    </div>
                </div>

                <div class="flex items-center gap-2.5">
                    <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-200 border border-emerald-400/30 backdrop-blur-md">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                        مفتوح

                </div>
            </div>
        </div>
    </header>

    <!-- شريط البحث (يختفي عند فتح أي قسم) -->
    <div id="searchBarContainer" class="sticky top-2 z-30 max-w-5xl mx-auto px-3 transition-all duration-300">
        <div class="burgundy-light-glass rounded-2xl p-2 flex items-center gap-2 shadow-lg">
            <button onclick="toggleRightGlassMenu()" class="burgundy-light-glass font-extrabold px-4 py-1.5 rounded-xl text-xs flex items-center gap-1.5 whitespace-nowrap hover:scale-105">
                <i class="fas fa-th-large text-xs text-amber-300"></i>
                <span>الأقسام الرئيسية</span>
            </button>
            
            <div class="relative flex-1">
                <input type="text" id="searchInput" oninput="handleSearch()" 
                       placeholder="ابحث عن مشروبك أو تحليتك..." 
                       class="w-full bg-offwhite/15 border border-offwhite/25 text-offwhite placeholder-offwhite/70 text-xs rounded-xl py-1.5 pr-8 pl-3 focus:outline-none focus:ring-2 focus:ring-amber-300 transition">
                <i class="fas fa-search absolute right-2.5 top-1/2 -translate-y-1/2 text-amber-300 text-xs"></i>
            </div>
        </div>
    </div>

    <!-- واجهة الاستقبال الرئيسية (Home View) -->
    <div id="homeViewSection" class="max-w-3xl mx-auto px-4 py-16 relative z-10 text-center flex flex-col items-center justify-center min-h-[55vh]">
        <div class="space-y-4">
            <h2 id="typewriterTitle" class="text-4xl sm:text-6xl font-bold ruqaa-welcome-text"></h2>
            <h1 id="typewriterSubtitle" class="text-2xl sm:text-5xl font-bold ruqaa-welcome-english"></h1>
            <p class="text-xs text-offwhite/80 pt-4">انقر على زر القائمة العائم أدناه لاستعراض الأقسام الفاخرة</p>
        </div>
    </div>

    <!-- واجهة القسم المنفصل (يظهر وحده دون الهيدر والبحث) -->
    <main class="max-w-4xl mx-auto px-3 py-4 relative z-10 space-y-6 hidden" id="categoryViewSection">
        <!-- يتم توليد واجهة القسم هنا -->
    </main>

    <!-- تغبيش وضبابية الخلفية فقط عند فتح الأقسام العائمة -->
    <div id="blurOnlyOverlay" class="blur-only-overlay" onclick="toggleRightGlassMenu()"></div>

    <!-- دوائر الأقسام العائمة رأسيًا فوق الزر الدائري -->
    <div class="vertical-categories-stack" id="verticalCategoriesContainer"></div>

    <!-- وحدة عائمة متحدة أسفل اليمين تجمع زر السلة وزر الأقسام الدائري الرئيسي -->
    <div id="floatingMenuContainer" class="fixed bottom-5 right-5 z-50 flex flex-col items-center gap-2.5 transition-all duration-300">
        <!-- زر السلة المتحد مع الدائرة -->
        <button onclick="toggleCartDrawer()" class="relative w-13 h-13 sm:w-14 sm:h-14 rounded-full burgundy-light-glass flex items-center justify-center text-amber-300 text-lg shadow-2xl border border-amber-300/40 hover:scale-110 active:scale-90 transition">
            <i class="fas fa-shopping-bag"></i>
            <span id="floatingCartBadge" class="absolute -top-1 -right-1 bg-red-600 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-extrabold shadow-md">0</span>
        </button>

        <!-- زر الأقسام الدائري الرئيسي -->
        <button id="rightGlassMenuTrigger" onclick="toggleRightGlassMenu()" class="right-glass-menu-trigger w-16 h-16 sm:w-18 sm:h-18 rounded-full text-amber-300 flex items-center justify-center text-2xl shadow-2xl transition transform active:scale-90">
            <i class="fas fa-utensils"></i>
        </button>
    </div>

    <!-- Cart Drawer (سلة الطلبات الجانبية) -->
    <div id="cartDrawer" class="fixed inset-0 z-50 hidden flex justify-end bg-burgundy-950/75 backdrop-blur-sm transition-opacity">
        <div class="bg-offwhite text-burgundy-900 w-full max-w-md h-full shadow-2xl flex flex-col justify-between transform drawer-slide-in border-l border-burgundy-200">
            <div class="p-4 bg-burgundy-800 text-offwhite flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i class="fas fa-shopping-basket text-amber-300 text-base"></i>
                    <h3 class="font-bold text-sm">سلة الطلبات - ايس هوم</h3>
                </div>
                <button onclick="toggleCartDrawer()" class="w-7 h-7 rounded-full burgundy-light-glass flex items-center justify-center"><i class="fas fa-times text-xs"></i></button>
            </div>

            <div id="cartItemsContainer" class="p-4 overflow-y-auto flex-1 space-y-3 divide-y divide-burgundy-100 text-right"></div>

            <div class="p-4 bg-burgundy-50 border-t border-burgundy-200 space-y-3">

                    <div class="flex justify-between"><span>المجموع الفرعي:</span><span id="subTotalText" class="font-bold text-burgundy-800">0 ر.س</span></div>
                    <div class="flex justify-between text-[10px] text-burgundy-600"><span>ضريبة القيمة المضافة (15%):</span><span>شاملة</span></div>

                </div>

                <div class="grid grid-cols-2 gap-2 pt-1">
                    <button onclick="sendOrderWhatsApp()" class="burgundy-light-glass bg-emerald-600/30 text-emerald-900 font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 border-emerald-500/40">
                        <i class="fab fa-whatsapp text-sm text-emerald-700"></i> <span class="text-burgundy-900">إرسال للواتساب</span>
                    </button>
                    <button onclick="showReceiptModal()" class="burgundy-light-glass font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2">
                        <i class="fas fa-file-invoice text-sm text-amber-300"></i> <span>الفاتورة الرقمية</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Notification Box -->
    <div id="customNotification" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 hidden bg-burgundy-900/90 text-amber-200 px-5 py-2.5 rounded-2xl shadow-2xl border border-amber-300/30 text-xs font-bold flex items-center gap-2.5 backdrop-blur-md transition-all duration-300">
        <i class="fas fa-check-circle text-amber-300 text-sm"></i>
        <span id="notificationText">تمت العملية بنجاح</span>
    </div>

        let activeCategoryId = null;

        let cart = [];
        let isRightMenuOpen = false;
        let selectedOptionsState = {};

        window.onload = function() {
            renderVerticalCategoriesStack();
            startTypewriterEffect();
        };

        function startTypewriterEffect() {
            const text1 = "أهلاً وسهلاً بكم";
            const text2 = "Ice Home";
            typeWriterText("typewriterTitle", text1, 100, () => {
                setTimeout(() => {
                    typeWriterText("typewriterSubtitle", text2, 120, null);
                }, 300);
            });
        }

        function typeWriterText(elementId, text, speed, callback) {
            let i = 0;
            const el = document.getElementById(elementId);
            if (!el) return;
            el.innerHTML = "";
            function type() {
                if (i < text.length) {
                    el.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                } else if (callback) {
                    callback();
                }
            }
            type();
        }

        function toggleRightGlassMenu() {
            isRightMenuOpen = !isRightMenuOpen;
            const trigger = document.getElementById('rightGlassMenuTrigger');
            const overlay = document.getElementById('blurOnlyOverlay');

            if (isRightMenuOpen) {
                trigger.classList.add('is-active');
                overlay.classList.add('is-active');
            } else {
                trigger.classList.remove('is-active');
                overlay.classList.remove('is-active');
            }
        }

        function goToHomeView() {
            activeCategoryId = null;
            document.getElementById('homeViewSection').classList.remove('hidden');
            document.getElementById('categoryViewSection').classList.add('hidden');
            
            // إظهار الهيدر والبحث عند العودة للرئيسية
            document.getElementById('mainHeader').classList.remove('hidden');
            document.getElementById('searchBarContainer').classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectCategory(catId) {
            activeCategoryId = catId;
            if (isRightMenuOpen) toggleRightGlassMenu();
            
            // إخفاء الهيدر وشريط البحث عند اختيار قسم
            document.getElementById('mainHeader').classList.add('hidden');
            document.getElementById('searchBarContainer').classList.add('hidden');

            document.getElementById('homeViewSection').classList.add('hidden');
            const catSection = document.getElementById('categoryViewSection');
            catSection.classList.remove('hidden');

            renderSeparateCategoryView(catId);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderVerticalCategoriesStack() {
            const container = document.getElementById('verticalCategoriesContainer');
            const reversedCats = [...categories].reverse();

            container.innerHTML = reversedCats.map((cat, index) => `
                <div class="category-bubble-item flex items-center justify-end gap-3 cursor-pointer group" 
                     style="transition-delay: ${index * 50}ms;" 
                     onclick="selectCategory('${cat.id}')">
                    
                    <span class="text-xs sm:text-sm font-bold text-offwhite bg-burgundy-900/50 backdrop-blur-md px-3.5 py-1.5 rounded-xl border border-offwhite/20 shadow-lg group-hover:bg-burgundy-800/80 transition whitespace-nowrap">
                        ${cat.name}
                    </span>

                    <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-full burgundy-light-glass flex items-center justify-center text-amber-300 text-base sm:text-lg shadow-xl group-hover:scale-110 transition flex-shrink-0">
                        <i class="fas ${cat.icon}"></i>
                    </div>
                </div>
            `).join('');
        }

        function renderSeparateCategoryView(catId) {
            const container = document.getElementById('categoryViewSection');
            const currentCat = categories.find(c => c.id === catId) || categories[0];
            
            const filteredItems = menuItems.filter(item => {
                const matchesCat = item.categoryId === catId;
                const matchesSearch = item.name.includes(currentSearchQuery) || item.desc.includes(currentSearchQuery);
                return matchesCat && matchesSearch;
            });

            container.innerHTML = `
                <!-- زر العودة للرئيسية -->
                <div class="flex items-center justify-between mb-2">
                    <button onclick="goToHomeView()" class="burgundy-light-glass px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-2 hover:scale-105 transition">
                        <i class="fas fa-arrow-right text-amber-300"></i>
                        <span>العودة للرئيسية</span>
                    </button>
                    <span class="text-xs text-amber-300/80 font-bold">${currentCat.name}</span>
                </div>

                <!-- 1. كارت اسم القسم المفتوح -->
                <div class="w-full burgundy-light-glass rounded-2xl py-2.5 px-6 text-center border border-amber-300/30 shadow-xl modal-fade-in">
                    <h2 class="text-base sm:text-lg font-black text-amber-200 tracking-wider flex items-center justify-center gap-2">
                        <i class="fas ${currentCat.icon} text-amber-300"></i>
                        <span>قسم: ${currentCat.name}</span>
                    </h2>
                </div>

                <!-- 2. قائمة أسماء الأطباق وأسعارها -->
                <div class="w-full burgundy-light-glass rounded-2xl p-4 shadow-xl border border-offwhite/20 modal-fade-in space-y-2">
                    <h3 class="text-xs font-bold text-amber-300/90 border-b border-offwhite/15 pb-2 mb-2 flex items-center justify-between">
                        <span>قائمة أطباق ${currentCat.name}</span>
                        <span class="text-[10px] text-offwhite/70">انقر للتمرير للطبق</span>
                    </h3>
                    
                    <div class="space-y-1.5 max-h-48 overflow-y-auto pr-1">
                        ${filteredItems.length > 0 ? filteredItems.map(item => `
                            <div onclick="scrollToDishCard(${item.id})" class="flex items-center justify-between py-1.5 px-3 rounded-xl bg-offwhite/5 hover:bg-offwhite/20 transition cursor-pointer text-xs font-bold text-offwhite">
                                <span class="truncate pl-2">${item.name}</span>
                                <span class="text-amber-300 whitespace-nowrap">${item.price} ر.س</span>
                            </div>
                        `).join('') : '<p class="text-center text-xs text-offwhite/60 py-2">لا توجد أطباق مطابقة للبحث</p>'}
                    </div>
                </div>

                <!-- 3. كارتات عمودية كبيرة 3D Carousel -->
                <div class="vertical-cards-perspective-wrapper modal-fade-in">
                    <div class="vertical-cards-carousel-track" id="verticalCardsTrack" onscroll="updateVerticalCardsPerspective()">
                        <div class="flex-shrink-0 w-[20vw]"></div>
                        ${filteredItems.map(item => renderLargeVerticalDishCard(item)).join('')}
                        <div class="flex-shrink-0 w-[20vw]"></div>
                    </div>
                </div>
            `;

            setTimeout(() => {
                updateVerticalCardsPerspective();
            }, 100);
        }

        function renderLargeVerticalDishCard(item) {
            const hasSizes = item.sizes && item.sizes.length > 0;

            if (!selectedOptionsState[item.id]) {
                selectedOptionsState[item.id] = {
                    sizePrice: 0,
                    sizeName: hasSizes ? item.sizes[0].name : '',
                    qty: 0
                };
            }

            const state = selectedOptionsState[item.id];

            return `
                <div class="large-vertical-dish-card burgundy-light-glass rounded-3xl p-4 flex flex-col justify-between border border-offwhite/30 shadow-2xl relative overflow-hidden" 
                     id="dish-card-${item.id}" data-id="${item.id}">
                    
                    <div class="relative w-full h-40 rounded-2xl overflow-hidden mb-3 border border-offwhite/20 bg-burgundy-950/60 flex-shrink-0">
                        <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover">
                        <span class="absolute top-2 right-2 bg-burgundy-900/90 text-amber-300 text-[9px] font-bold px-2.5 py-0.5 rounded-full border border-amber-300/30">
                            ${item.tag || 'فاخر'}
                        </span>
                    </div>

                    <div class="text-right space-y-1 mb-2">
                        <h4 class="font-extrabold text-sm text-amber-200">${item.name}</h4>
                        <p class="text-[10px] text-offwhite/80 line-clamp-2 leading-tight">${item.desc}</p>
                        <span class="text-sm font-black text-amber-300 block pt-0.5">${item.price} ر.س</span>
                    </div>

                    <div class="space-y-1.5 border-t border-offwhite/15 pt-2 mb-3 text-right text-[10px]">
                        ${hasSizes ? `
                            <div>
                                <label class="block font-bold text-amber-200 mb-1">اختر الحجم:</label>
                                <div class="grid grid-cols-2 gap-1">
                                    ${item.sizes.map((s) => `
                                        <button onclick="cardSelectSize(${item.id}, ${s.price}, '${s.name}', this)" 
                                                class="py-1 px-1 rounded-lg border text-[9px] font-bold text-center transition ${state.sizeName === s.name ? 'border-amber-300 bg-amber-300/20 text-amber-200' : 'border-offwhite/20 text-offwhite/80'}">
                                            ${s.name} ${s.price > 0 ? `(+${s.price})` : ''}
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>

                    <div id="action-area-${item.id}" class="mt-auto pt-2">
                        ${state.qty === 0 ? `
                            <button onclick="initialAddDish(${item.id})" class="w-full py-2 px-3 rounded-xl bg-amber-400/20 hover:bg-amber-400/30 text-amber-200 font-extrabold text-xs flex items-center justify-center gap-2 border border-amber-300/40 shadow-lg transition active:scale-95">
                                <i class="fas fa-shopping-bag text-amber-300 text-xs"></i>
                                <span>إضافة للسلة</span>
                            </button>
                        ` : `
                            <div class="flex items-center justify-between bg-burgundy-900/60 rounded-xl p-1.5 border border-amber-300/40 shadow-lg">
                                <button onclick="updateDishCardQty(${item.id}, -1)" class="w-8 h-8 rounded-lg bg-burgundy-800 hover:bg-burgundy-700 text-amber-300 font-bold flex items-center justify-center transition">
                                    <i class="fas fa-minus text-xs"></i>
                                </button>
                                <span class="font-bold text-offwhite text-sm px-2">${state.qty}</span>
                                <button onclick="updateDishCardQty(${item.id}, 1)" class="w-8 h-8 rounded-lg bg-burgundy-800 hover:bg-burgundy-700 text-amber-300 font-bold flex items-center justify-center transition">
                                    <i class="fas fa-plus text-xs"></i>
                                </button>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        function initialAddDish(dishId) {
            if (!selectedOptionsState[dishId]) return;
            selectedOptionsState[dishId].qty = 1;
            syncCartWithDishState(dishId);
            refreshDishCardActionArea(dishId);
            showNotification('تمت الإضافة للسلة ✨');
        }

        function updateDishCardQty(dishId, delta) {
            if (!selectedOptionsState[dishId]) return;
            selectedOptionsState[dishId].qty += delta;
            if (selectedOptionsState[dishId].qty < 0) {
                selectedOptionsState[dishId].qty = 0;
            }
            syncCartWithDishState(dishId);
            refreshDishCardActionArea(dishId);
        }

        function refreshDishCardActionArea(dishId) {
            const area = document.getElementById(`action-area-${dishId}`);
            const item = menuItems.find(i => i.id === dishId);
            const state = selectedOptionsState[dishId];
            if (!area || !item) return;

            if (state.qty === 0) {
                area.innerHTML = `
                    <button onclick="initialAddDish(${item.id})" class="w-full py-2 px-3 rounded-xl bg-amber-400/20 hover:bg-amber-400/30 text-amber-200 font-extrabold text-xs flex items-center justify-center gap-2 border border-amber-300/40 shadow-lg transition active:scale-95">
                        <i class="fas fa-shopping-bag text-amber-300 text-xs"></i>
                        <span>إضافة للسلة</span>
                    </button>
                `;
            } else {
                area.innerHTML = `
                    <div class="flex items-center justify-between bg-burgundy-900/60 rounded-xl p-1.5 border border-amber-300/40 shadow-lg">
                        <button onclick="updateDishCardQty(${item.id}, -1)" class="w-8 h-8 rounded-lg bg-burgundy-800 hover:bg-burgundy-700 text-amber-300 font-bold flex items-center justify-center transition">
                            <i class="fas fa-minus text-xs"></i>
                        </button>
                        <span class="font-bold text-offwhite text-sm px-2">${state.qty}</span>
                        <button onclick="updateDishCardQty(${item.id}, 1)" class="w-8 h-8 rounded-lg bg-burgundy-800 hover:bg-burgundy-700 text-amber-300 font-bold flex items-center justify-center transition">
                            <i class="fas fa-plus text-xs"></i>
                        </button>
                    </div>
                `;
            }
        }

        function syncCartWithDishState(dishId) {
            const item = menuItems.find(i => i.id === dishId);
            const state = selectedOptionsState[dishId];
            if (!item) return;

            let cartIndex = cart.findIndex(c => c.itemId === dishId && c.option === state.sizeName);

            if (state.qty === 0) {
                if (cartIndex !== -1) {
                    cart.splice(cartIndex, 1);
                }
            } else {
                const unitPrice = item.price + state.sizePrice;
                if (cartIndex !== -1) {
                    cart[cartIndex].qty = state.qty;
                    cart[cartIndex].totalPrice = unitPrice * state.qty;
                } else {
                    cart.push({
                        itemId: item.id,
                        name: item.name,
                        option: state.sizeName,
                        unitPrice: unitPrice,
                        qty: state.qty,
                        totalPrice: unitPrice * state.qty
                    });
                }
            }
            updateCartUI();
        }

        function updateVerticalCardsPerspective() {
            const track = document.getElementById('verticalCardsTrack');
            if (!track) return;

            const cards = Array.from(track.querySelectorAll('.large-vertical-dish-card'));
            const trackCenter = track.getBoundingClientRect().left + track.offsetWidth / 2;

            let closestCard = null;
            let minDistance = Infinity;

            cards.forEach(card => {
                const cardCenter = card.getBoundingClientRect().left + card.getBoundingClientRect().width / 2;
                const distance = Math.abs(trackCenter - cardCenter);
                if (distance < minDistance) {
                    minDistance = distance;
                    closestCard = card;
                }
            });

            cards.forEach(card => {
                if (card === closestCard) {
                    card.classList.add('is-center');
                } else {
                    card.classList.remove('is-center');
                }
            });
        }

        function scrollToDishCard(dishId) {
            const card = document.getElementById(`dish-card-${dishId}`);
            if (card) {
                card.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }
        }

        function cardSelectSize(dishId, price, sizeName, btn) {
            if (!selectedOptionsState[dishId]) return;
            selectedOptionsState[dishId].sizePrice = price;
            selectedOptionsState[dishId].sizeName = sizeName;

            const parent = btn.parentElement;
            Array.from(parent.children).forEach(c => {
                c.classList.remove('border-amber-300', 'bg-amber-300/20', 'text-amber-200');
                c.classList.add('border-offwhite/20', 'text-offwhite/80');
            });
            btn.classList.add('border-amber-300', 'bg-amber-300/20', 'text-amber-200');
            btn.classList.remove('border-offwhite/20', 'text-offwhite/80');

            syncCartWithDishState(dishId);
        }

        function handleSearch() {
            currentSearchQuery = document.getElementById('searchInput').value.trim();
            if (activeCategoryId) {
                renderSeparateCategoryView(activeCategoryId);
            }
        }

        function updateCartUI() {
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('floatingCartBadge').innerText = totalItems;
            renderCartDrawerItems();
        }

        function toggleCartDrawer() {
            const drawer = document.getElementById('cartDrawer');
            drawer.classList.toggle('hidden');
        }

        function renderCartDrawerItems() {
            const container = document.getElementById('cartItemsContainer');
            const subTotalText = document.getElementById('subTotalText');
            const grandTotalText = document.getElementById('grandTotalText');

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-burgundy-300">
                        <i class="fas fa-shopping-basket text-3xl mb-3 text-burgundy-200"></i>
                        <p class="text-xs font-bold text-burgundy-700">سلتك فارغة حالياً</p>
                    </div>
                `;
                subTotalText.innerText = '0 ر.س';
                grandTotalText.innerText = '0 ر.س';
                return;
            }

            const grandTotal = cart.reduce((sum, item) => sum + item.totalPrice, 0);
            subTotalText.innerText = `${grandTotal} ر.س`;
            grandTotalText.innerText = `${grandTotal} ر.س`;

            container.innerHTML = cart.map(item => `
                <div class="pt-3 first:pt-0 flex items-center justify-between gap-2 text-burgundy-900">
                    <div class="flex-1">
                        <h4 class="font-bold text-burgundy-900 text-xs">${item.name}</h4>
                        <div class="text-[10px] text-burgundy-600 mt-0.5">
                            ${item.option ? `<span>الحجم: ${item.option}</span>` : ''}
                        </div>
                        <span class="font-bold text-burgundy-700 text-xs mt-1 block">${item.totalPrice} ر.س</span>
                    </div>

                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold px-2 py-1 bg-burgundy-100 rounded-lg">الكمية: ${item.qty}</span>
                        <button onclick="removeCartItemDirect(${item.itemId})" class="text-rose-500 hover:text-rose-700 p-1 transition">
                            <i class="fas fa-trash-alt text-xs"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function removeCartItemDirect(dishId) {
            if (selectedOptionsState[dishId]) {
                selectedOptionsState[dishId].qty = 0;
                refreshDishCardActionArea(dishId);
            }
            cart = cart.filter(i => i.itemId !== dishId);
            updateCartUI();
        }

        function sendOrderWhatsApp() {
            if (cart.length === 0) return;

            let msg = `*طلب جديد من منيو ايس هوم 🍦☕*\n\n`;
            cart.forEach((item, index) => {
                msg += `${index + 1}. *${item.name}* (العدد: ${item.qty})\n`;
                if (item.option) msg += `   • الحجم: ${item.option}\n`;
                msg += `   • السعر: ${item.totalPrice} ر.س\n\n`;
            });

            const total = cart.reduce((s, i) => s + i.totalPrice, 0);
            msg += `*إجمالي الطلب:* ${total} ر.س\n`;
            msg += `شكراً لاختياركم ايس هوم! ❤️`;

            const encoded = encodeURIComponent(msg);
            window.open(`https://wa.me/966500000000?text=${encoded}`, '_blank');
        }

        function showReceiptModal() {
            if (cart.length === 0) return;
            const total = cart.reduce((s, i) => s + i.totalPrice, 0);
            showNotification(`إجمالي الفاتورة الرقمية: ${total} ر.س — جاهزة للطلب`);
        }

        function showNotification(text) {
            const notif = document.getElementById('customNotification');
            document.getElementById('notificationText').innerText = text;
            notif.classList.remove('hidden', 'opacity-0');
            setTimeout(() => {
                notif.classList.add('opacity-0');
                setTimeout(() => notif.classList.add('hidden'), 300);
            }, 3000);
        }
    </script>
</body>
</html>
