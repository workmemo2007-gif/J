<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ايس هوم | Ice Home - المنيو الرقمي التفاعلي</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        burgundy: {
                            50: '#fcf2f4',
                            100: '#f6dbe0',
                            200: '#ebaac2',
                            600: '#8c1a35',
                            700: '#6b1d2f',
                            800: '#58111a',
                            900: '#3d0a11',
                        },
                        ivory: {
                            DEFAULT: '#FAF8f5',
                            card: '#FFFFFF',
                            soft: '#F4EFEA',
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #FAF8f5;
            color: #2D2D2D;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animated Translucent Pattern Background */
        .pattern-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 0; opacity: 0.16;
            background-image: radial-gradient(rgba(107, 29, 47, 0.28) 1px, transparent 1px), radial-gradient(rgba(120, 120, 120, 0.22) 1px, #FAF8f5 1px);
            background-size: 30px 30px; animation: movePattern 40s linear infinite;
        }

        @keyframes movePattern {
            0% { background-position: 0 0, 15px 15px; }
            100% { background-position: 300px 300px, 315px 315px; }
        }

        .gradient-text-gold {
            background: linear-gradient(135deg, #fef08a 0%, #f59e0b 50%, #d97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(107, 29, 47, 0.1);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .app-bottom-nav {
            background: rgba(61, 10, 17, 0.88);
            backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.25);
        }

        /* Interactive Visual Builder Animations */
        .preview-img {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
        }
        .preview-img.scale-large {
            transform: scale(1.15) rotate(2deg);
        }

        .floating-badge {
            animation: floatUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes floatUp {
            from { opacity: 0; transform: translateY(15px) scale(0.7); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .drawer-slide-in { animation: drawerSlideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes drawerSlideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        .modal-fade-in { animation: modalFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.92) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    </style>
</head>
<body class="relative min-h-screen pb-32 select-none">

    <div class="pattern-bg"></div>

    <!-- Header -->
    <header class="relative w-full h-48 sm:h-56 overflow-hidden shadow-xl">
        <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1600&q=80" alt="Ice Home Cover" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-b from-burgundy-950/40 via-burgundy-900/80 to-burgundy-900 flex flex-col justify-between p-4">
            <div class="flex justify-between items-center">
                <button onclick="toggleSidebarDrawer()" class="w-10 h-10 rounded-full bg-white/15 flex items-center justify-center text-white border border-white/25">
                    <i class="fas fa-bars text-amber-300"></i>
                </button>
                <span class="px-3 py-1 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-200 border border-emerald-400/30">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-ping ml-1"></span> مفتوح الآن
                </span>
            </div>
            <div class="flex items-center gap-3 mt-auto mb-1">
                <div class="w-14 h-14 rounded-full bg-burgundy-900 border-2 border-amber-300 p-1 flex items-center justify-center text-amber-300">
                    <i class="fas fa-ice-cream text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black text-white gradient-text-gold">آيس هوم | Ice Home</h1>
                    <p class="text-[11px] text-gray-200">اختر طبقك وقم بتخصيصه تفاعلياً على ذوقك</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Search Bar -->
    <div class="sticky top-0 z-30 bg-burgundy-800/95 backdrop-blur-md border-b border-amber-500/20 shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-2.5">
            <div class="relative">
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="ابحث عن مشروبك أو تحليتك..." class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-300 text-xs rounded-full py-2.5 pr-10 pl-4 focus:outline-none focus:ring-2 focus:ring-amber-400">
                <i class="fas fa-search absolute right-3.5 top-1/2 -translate-y-1/2 text-amber-300/80 text-xs"></i>
            </div>
        </div>
    </div>

    <!-- App Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-6 space-y-8" id="appMainContainer"></main>

    <!-- Interactive Builder Screen (Full Screen Customizer) -->
    <div id="builderScreen" class="fixed inset-0 z-50 hidden bg-ivory flex flex-col modal-fade-in overflow-hidden">
        
        <!-- Builder Top Bar -->
        <div class="bg-burgundy-900 text-white px-4 py-3.5 flex items-center justify-between border-b border-amber-500/20 shadow-lg">
            <button onclick="closeBuilder()" class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center text-amber-300 hover:bg-white/20 transition">
                <i class="fas fa-arrow-right"></i>
            </button>
            <div class="text-center">
                <h3 class="font-extrabold text-sm text-amber-200" id="builderHeaderTitle">صمم مشروبك</h3>
                <p class="text-[9px] text-gray-300">التخصيص التفاعلي المباشر</p>
            </div>
            <div class="w-9"></div>
        </div>

        <div class="flex-1 overflow-y-auto pb-28">
            
            <!-- Visual Live Stage (Interactive Drink Display) -->
            <div class="relative w-full h-64 bg-gradient-to-b from-burgundy-900 via-burgundy-800 to-ivory flex items-center justify-center overflow-hidden border-b border-amber-500/10">
                
                <!-- Glowing Aura Ring -->
                <div class="absolute w-48 h-48 rounded-full bg-amber-400/20 blur-2xl animate-pulse"></div>

                <!-- Product Display Base -->
                <div class="relative z-10 flex items-center justify-center">
                    <img id="builderVisualImg" src="" class="preview-img w-40 h-40 object-cover rounded-3xl shadow-2xl border-2 border-amber-300/40">
                </div>

                <!-- Live Dynamic Badges Overlay -->
                <div id="liveBadgesContainer" class="absolute inset-0 pointer-events-none p-4 flex flex-col justify-between z-20">
                    <div class="flex justify-between items-start">
                        <span id="badgeSize" class="floating-badge bg-burgundy-900/90 text-amber-300 border border-amber-400/30 text-[10px] font-black px-3 py-1 rounded-full shadow-lg backdrop-blur-md">
                            حجم وسط
                        </span>
                        <span id="badgeCalories" class="floating-badge bg-amber-500/90 text-burgundy-950 font-black text-[10px] px-2.5 py-1 rounded-full shadow-lg backdrop-blur-md">
                            🔥 ~210 سعرة
                        </span>
                    </div>

                    <!-- Selected Addons Pill List -->
                    <div id="badgeAddonsList" class="flex flex-wrap gap-1.5 justify-center">
                        <!-- Injected JS -->
                    </div>
                </div>
            </div>

            <!-- Customization Controls Grid -->
            <div class="max-w-xl mx-auto p-4 space-y-5 text-right">
                
                <!-- Title & Base Price -->
                <div class="flex justify-between items-start border-b pb-3">
                    <div>
                        <h2 id="builderItemTitle" class="text-xl font-black text-burgundy-900"></h2>
                        <p id="builderItemDesc" class="text-xs text-gray-500 mt-1"></p>
                    </div>
                    <span id="builderBasePrice" class="text-lg font-black text-burgundy-700 bg-burgundy-50 px-3 py-1 rounded-xl"></span>
                </div>

                <!-- 1. Size Selection -->
                <div class="space-y-2">
                    <label class="block text-xs font-black text-burgundy-900 flex items-center gap-1.5">
                        <i class="fas fa-glass-whiskey text-amber-500"></i> اختر الحجم المطلوب:
                    </label>
                    <div id="builderSizesGrid" class="grid grid-cols-2 gap-2.5"></div>
                </div>

                <!-- 2. Sugar Level Selector (%) -->
                <div class="space-y-2 pt-2 border-t border-gray-200/60">
                    <label class="block text-xs font-black text-burgundy-900 flex items-center gap-1.5">
                        <i class="fas fa-cubes text-amber-500"></i> نسبة السكر:
                    </label>
                    <div class="grid grid-cols-4 gap-2">
                        <button onclick="setSugar(0, this)" class="sugar-btn border rounded-xl py-2 text-xs font-bold transition hover:bg-burgundy-50">بدون (0%)</button>
                        <button onclick="setSugar(25, this)" class="sugar-btn border rounded-xl py-2 text-xs font-bold transition hover:bg-burgundy-50">قليل (25%)</button>
                        <button onclick="setSugar(50, this)" class="sugar-btn border border-burgundy-700 bg-burgundy-50 text-burgundy-900 rounded-xl py-2 text-xs font-bold transition">متوسط (50%)</button>
                        <button onclick="setSugar(100, this)" class="sugar-btn border rounded-xl py-2 text-xs font-bold transition hover:bg-burgundy-50">كامل (100%)</button>
                    </div>
                </div>

                <!-- 3. Milk Type Selection -->
                <div class="space-y-2 pt-2 border-t border-gray-200/60">
                    <label class="block text-xs font-black text-burgundy-900 flex items-center gap-1.5">
                        <i class="fas fa-blender text-amber-500"></i> نوع الحليب الفاخر:
                    </label>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <label class="border border-burgundy-700 bg-burgundy-50 p-2.5 rounded-xl flex items-center justify-between cursor-pointer font-bold" onclick="selectMilk('كامل الدسم', 0, this)">
                            <span>حليب كامل الدسم</span> <span class="text-gray-400">أساسي</span>
                        </label>
                        <label class="border border-gray-200 p-2.5 rounded-xl flex items-center justify-between cursor-pointer hover:bg-gray-50" onclick="selectMilk('حليب الشوفان', 4, this)">
                            <span>حليب الشوفان</span> <span class="text-burgundy-700 font-bold">+4 ر.س</span>
                        </label>
                        <label class="border border-gray-200 p-2.5 rounded-xl flex items-center justify-between cursor-pointer hover:bg-gray-50" onclick="selectMilk('حليب اللوز', 5, this)">
                            <span>حليب اللوز النباتي</span> <span class="text-burgundy-700 font-bold">+5 ر.س</span>
                        </label>
                        <label class="border border-gray-200 p-2.5 rounded-xl flex items-center justify-between cursor-pointer hover:bg-gray-50" onclick="selectMilk('خالي الدسم', 0, this)">
                            <span>خالي الدسم</span> <span class="text-gray-400">مجاناً</span>
                        </label>
                    </div>
                </div>

                <!-- 4. Ice Level -->
                <div class="space-y-2 pt-2 border-t border-gray-200/60">
                    <label class="block text-xs font-black text-burgundy-900 flex items-center gap-1.5">
                        <i class="fas fa-snowflake text-amber-500"></i> كمية الثلج:
                    </label>
                    <div class="grid grid-cols-3 gap-2 text-xs">
                        <button onclick="setIce('بدون ثلج', this)" class="ice-btn border rounded-xl py-2 font-bold hover:bg-burgundy-50">بدون ثلج</button>
                        <button onclick="setIce('ثلج معتدل', this)" class="ice-btn border border-burgundy-700 bg-burgundy-50 text-burgundy-900 rounded-xl py-2 font-bold">معتدل ❄️</button>
                        <button onclick="setIce('ثلج إضافي', this)" class="ice-btn border rounded-xl py-2 font-bold hover:bg-burgundy-50">إضافي 🧊</button>
                    </div>
                </div>

                <!-- 5. Interactive Extras & Sauces -->
                <div class="space-y-2 pt-2 border-t border-gray-200/60">
                    <label class="block text-xs font-black text-burgundy-900 flex items-center gap-1.5">
                        <i class="fas fa-mortar-pestle text-amber-500"></i> الإضافات والصوصات الفاخرة:
                    </label>
                    <div id="builderExtrasList" class="space-y-2"></div>
                </div>

            </div>
        </div>

        <!-- Sticky Bottom Checkout Bar -->
        <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 shadow-2xl z-30">
            <div class="max-w-xl mx-auto flex items-center justify-between gap-4">
                <div class="flex items-center border border-gray-300 rounded-full bg-gray-50 px-2 py-1">
                    <button onclick="changeBuilderQty(-1)" class="w-8 h-8 rounded-full text-burgundy-900 font-black hover:bg-gray-200">-</button>
                    <span id="builderQtyText" class="w-8 text-center font-black text-sm">1</span>
                    <button onclick="changeBuilderQty(1)" class="w-8 h-8 rounded-full text-burgundy-900 font-black hover:bg-gray-200">+</button>
                </div>

                <button onclick="confirmBuilderAddToCart()" class="flex-1 bg-burgundy-800 hover:bg-burgundy-900 text-white font-extrabold py-3.5 px-5 rounded-2xl text-xs sm:text-sm flex items-center justify-between shadow-xl transition active:scale-95">
                    <span class="flex items-center gap-2"><i class="fas fa-shopping-bag text-amber-300"></i> إضافة للمزيج</span>
                    <span id="builderTotalPriceText" class="text-amber-300 font-black">0 ر.س</span>
                </button>
            </div>
        </div>

    </div>

    <!-- App Bottom Tab Bar Navigation -->
    <nav class="fixed bottom-3 left-4 right-4 z-40 max-w-md mx-auto">
        <div class="app-bottom-nav rounded-2xl py-2 px-3 flex items-center justify-around text-white">
            <button onclick="scrollToTop()" class="flex flex-col items-center gap-0.5 px-3 py-1">
                <i class="fas fa-home text-amber-300 text-sm"></i><span class="text-[9px] font-bold">الرئيسية</span>
            </button>
            <button onclick="toggleSidebarDrawer()" class="flex flex-col items-center gap-0.5 px-3 py-1">
                <i class="fas fa-list-ul text-amber-300 text-sm"></i><span class="text-[9px] font-bold">المنيو</span>
            </button>
            <button onclick="toggleCartDrawer()" class="relative flex flex-col items-center gap-0.5 px-3 py-1">
                <i class="fas fa-shopping-bag text-amber-300 text-sm"></i><span class="text-[9px] font-bold">السلة</span>
                <span id="bottomCartBadge" class="absolute top-0.5 right-2 bg-red-600 text-white text-[8px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
            </button>
        </div>
    </nav>

    <!-- Sidebar Drawer & Cart Modals -->
    <div id="sidebarDrawer" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="toggleSidebarDrawer()"></div>
        <div class="absolute right-0 top-0 bottom-0 w-80 bg-white shadow-2xl flex flex-col justify-between drawer-slide-in">
            <div class="p-4 bg-burgundy-800 text-white flex justify-between items-center">
                <h3 class="font-bold text-sm">أقسام المنيو</h3>
                <button onclick="toggleSidebarDrawer()"><i class="fas fa-times"></i></button>
            </div>
            <div id="sidebarCategoriesList" class="p-4 overflow-y-auto space-y-2"></div>
        </div>
    </div>

    <div id="cartDrawer" class="fixed inset-0 z-50 hidden flex justify-end">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="toggleCartDrawer()"></div>
        <div class="relative bg-white w-full max-w-md h-full shadow-2xl flex flex-col justify-between drawer-slide-in z-10">
            <div class="p-4 bg-burgundy-800 text-white flex justify-between items-center">
                <h3 class="font-bold">سلة الطلبات</h3>
                <button onclick="toggleCartDrawer()"><i class="fas fa-times"></i></button>
            </div>
            <div id="cartItemsContainer" class="p-4 overflow-y-auto flex-1 divide-y"></div>
            <div class="p-4 bg-gray-50 border-t space-y-3">
                <div class="flex justify-between font-black text-burgundy-900"><span>المجموع الكلي:</span><span id="grandTotalText">0 ر.س</span></div>
                <button onclick="sendOrderWhatsApp()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2">
                    <i class="fab fa-whatsapp"></i> إرسال الطلب للواتساب
                </button>
            </div>
        </div>
    </div>

    <div id="customNotification" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 hidden bg-burgundy-900 text-amber-200 px-5 py-3 rounded-2xl shadow-2xl text-xs font-bold">
        <span id="notificationText">تمت العملية</span>
    </div>

    <script>
        const categories = [
            { id: 'iced-drinks', name: 'المشروبات البارده', icon: 'fa-glass-martini-alt' },
            { id: 'ice-cream', name: 'الآيس كريم والجيلاتو', icon: 'fa-ice-cream' },
            { id: 'desserts', name: 'الحلويات الفاخرة', icon: 'fa-cheese' }
        ];

        const menuItems = [
            {
                id: 1, categoryId: 'iced-drinks', name: 'آيس شيكن وايت موكا', desc: 'مزيج الموكا البيضاء مع اسبريسو فاخر وحليب بارد ورغوة غنية', price: 24,
                image: 'https://images.unsplash.com/photo-1517701604599-bb29b565090c?auto=format&fit=crop&w=400&q=80',
                sizes: [{ name: 'وسط', price: 0 }, { name: 'كبير', price: 4 }],
                extras: [{ name: 'إضافة صوص بستاشيو', price: 5 }, { name: 'جرعة اسبريسو إضافية', price: 4 }]
            },
            {
                id: 2, categoryId: 'ice-cream', name: 'آيس كريم هوم سبيشل', desc: 'جيلاتو الفانيلا والشوكلاتة مع الفستق', price: 28,
                image: 'https://images.unsplash.com/photo-1563805042-7684c019e1cb?auto=format&fit=crop&w=400&q=80',
                sizes: [{ name: 'كأس عادي', price: 0 }, { name: 'بسكويت وافل مضاعف', price: 6 }],
                extras: [{ name: 'صوص نوتيلا دافئ', price: 3 }, { name: 'مكسرات محمصة', price: 4 }]
            }
        ];

        let cart = [];
        let selectedItem = null;
        let builderConfig = { sizePrice: 0, sizeName: 'وسط', sugar: '50%', milk: 'كامل الدسم', milkPrice: 0, ice: 'ثلج معتدل', extras: [], qty: 1 };

        window.onload = function() {
            renderSidebarCategories();
            renderAppCarousels();
        };

        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

        function renderSidebarCategories() {
            document.getElementById('sidebarCategoriesList').innerHTML = categories.map(c => `
                <div class="p-2.5 bg-gray-50 rounded-xl font-bold text-xs text-gray-700 flex items-center justify-between">
                    <span>${c.name}</span><i class="fas ${c.icon}"></i>
                </div>
            `).join('');
        }

        function renderAppCarousels() {
            document.getElementById('appMainContainer').innerHTML = categories.map(cat => {
                const items = menuItems.filter(i => i.categoryId === cat.id);
                return `
                    <section class="space-y-3">
                        <h2 class="text-base font-black text-burgundy-900 flex items-center gap-2">
                            <i class="fas ${cat.icon} text-amber-500"></i> ${cat.name}
                        </h2>
                        <div class="flex gap-3 overflow-x-auto no-scrollbar py-2">
                            ${items.map(item => `
                                <div class="glass-panel rounded-2xl p-2.5 w-44 flex-shrink-0 flex flex-col justify-between">
                                    <div onclick="openBuilder(${item.id})" class="cursor-pointer">
                                        <img src="${item.image}" class="w-full h-32 object-cover rounded-xl mb-2">
                                        <h3 class="font-bold text-xs text-burgundy-900 truncate">${item.name}</h3>
                                        <span class="text-amber-600 font-black text-xs block mt-1">${item.price} ر.س</span>
                                    </div>
                                    <button onclick="openBuilder(${item.id})" class="mt-2 w-full bg-burgundy-800 text-white rounded-lg py-1.5 text-[10px] font-bold flex items-center justify-center gap-1">
                                        <i class="fas fa-sliders-h"></i> تخصيص
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                `;
            }).join('');
        }

        /* Open Interactive Visual Builder */
        function openBuilder(id) {
            selectedItem = menuItems.find(i => i.id === id);
            if (!selectedItem) return;

            builderConfig = { sizePrice: 0, sizeName: selectedItem.sizes[0]?.name || 'عادي', sugar: '50%', milk: 'كامل الدسم', milkPrice: 0, ice: 'ثلج معتدل', extras: [], qty: 1 };

            document.getElementById('builderVisualImg').src = selectedItem.image;
            document.getElementById('builderHeaderTitle').innerText = `تخصيص: ${selectedItem.name}`;
            document.getElementById('builderItemTitle').innerText = selectedItem.name;
            document.getElementById('builderItemDesc').innerText = selectedItem.desc;
            document.getElementById('builderBasePrice').innerText = `${selectedItem.price} ر.س`;
            document.getElementById('builderQtyText').innerText = 1;

            // Render Sizes
            document.getElementById('builderSizesGrid').innerHTML = selectedItem.sizes.map((s, idx) => `
                <button onclick="selectSize('${s.name}', ${s.price}, this)" class="size-btn border rounded-xl p-2.5 flex items-center justify-between text-xs transition ${idx === 0 ? 'border-burgundy-700 bg-burgundy-50 font-bold' : 'border-gray-200'}">
                    <span>${s.name}</span>
                    <span class="text-gray-500">${s.price > 0 ? `+${s.price} ر.س` : 'أساسي'}</span>
                </button>
            `).join('');

            // Render Extras
            document.getElementById('builderExtrasList').innerHTML = selectedItem.extras.map(e => `
                <label class="border border-gray-200 rounded-xl p-2.5 flex items-center justify-between text-xs cursor-pointer hover:bg-gray-50">
                    <div class="flex items-center gap-2">
                        <input type="checkbox" onchange="toggleExtra('${e.name}', ${e.price}, this)" class="accent-burgundy-700 w-4 h-4">
                        <span class="font-bold">${e.name}</span>
                    </div>
                    <span class="text-burgundy-700 font-bold">+${e.price} ر.س</span>
                </label>
            `).join('');

            updateBuilderUI();
            document.getElementById('builderScreen').classList.remove('hidden');
        }

        function closeBuilder() { document.getElementById('builderScreen').classList.add('hidden'); }

        function selectSize(name, price, btn) {
            builderConfig.sizeName = name;
            builderConfig.sizePrice = price;

            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('border-burgundy-700', 'bg-burgundy-50', 'font-bold'));
            btn.classList.add('border-burgundy-700', 'bg-burgundy-50', 'font-bold');

            // Interactive Visual Effect: Scale Up Image
            const img = document.getElementById('builderVisualImg');
            if (price > 0 || name.includes('كبير') || name.includes('مضاعف')) {
                img.classList.add('scale-large');
            } else {
                img.classList.remove('scale-large');
            }

            updateBuilderUI();
        }

        function setSugar(percent, btn) {
            builderConfig.sugar = `${percent}%`;
            document.querySelectorAll('.sugar-btn').forEach(b => b.classList.remove('border-burgundy-700', 'bg-burgundy-50', 'text-burgundy-900'));
            btn.classList.add('border-burgundy-700', 'bg-burgundy-50', 'text-burgundy-900');
            updateBuilderUI();
        }

        function selectMilk(name, price, el) {
            builderConfig.milk = name;
            builderConfig.milkPrice = price;
            const parent = el.parentElement;
            for (let child of parent.children) {
                child.classList.remove('border-burgundy-700', 'bg-burgundy-50', 'font-bold');
            }
            el.classList.add('border-burgundy-700', 'bg-burgundy-50', 'font-bold');
            updateBuilderUI();
        }

        function setIce(level, btn) {
            builderConfig.ice = level;
            document.querySelectorAll('.ice-btn').forEach(b => b.classList.remove('border-burgundy-700', 'bg-burgundy-50', 'text-burgundy-900'));
            btn.classList.add('border-burgundy-700', 'bg-burgundy-50', 'text-burgundy-900');
            updateBuilderUI();
        }

        function toggleExtra(name, price, chk) {
            if (chk.checked) {
                builderConfig.extras.push({ name, price });
            } else {
                builderConfig.extras = builderConfig.extras.filter(e => e.name !== name);
            }
            updateBuilderUI();
        }

        function changeBuilderQty(delta) {
            builderConfig.qty = Math.max(1, builderConfig.qty + delta);
            document.getElementById('builderQtyText').innerText = builderConfig.qty;
            updateBuilderUI();
        }

        function updateBuilderUI() {
            const extrasTotal = builderConfig.extras.reduce((s, e) => s + e.price, 0);
            const unitPrice = selectedItem.price + builderConfig.sizePrice + builderConfig.milkPrice + extrasTotal;
            const total = unitPrice * builderConfig.qty;

            document.getElementById('builderTotalPriceText').innerText = `${total} ر.س`;
            document.getElementById('badgeSize').innerText = `حجم ${builderConfig.sizeName}`;

            // Render Badges Overlay
            const badgesContainer = document.getElementById('badgeAddonsList');
            let badgesHTML = `<span class="bg-white/80 text-burgundy-900 text-[9px] font-bold px-2 py-0.5 rounded-full shadow">سكر: ${builderConfig.sugar}</span>`;
            if (builderConfig.milk !== 'كامل الدسم') badgesHTML += `<span class="bg-amber-400 text-burgundy-950 text-[9px] font-bold px-2 py-0.5 rounded-full shadow">${builderConfig.milk}</span>`;
            builderConfig.extras.forEach(e => {
                badgesHTML += `<span class="bg-emerald-600 text-white text-[9px] font-bold px-2 py-0.5 rounded-full shadow">+ ${e.name}</span>`;
            });
            badgesContainer.innerHTML = badgesHTML;
        }

        function confirmBuilderAddToCart() {
            const extrasTotal = builderConfig.extras.reduce((s, e) => s + e.price, 0);
            const unitPrice = selectedItem.price + builderConfig.sizePrice + builderConfig.milkPrice + extrasTotal;

            cart.push({
                cartId: Date.now(),
                name: selectedItem.name,
                details: `حجم ${builderConfig.sizeName} | سكر ${builderConfig.sugar} | ${builderConfig.milk} | ${builderConfig.ice} ${builderConfig.extras.map(e => e.name).join(', ')}`,
                unitPrice: unitPrice,
                qty: builderConfig.qty,
                totalPrice: unitPrice * builderConfig.qty
            });

            closeBuilder();
            updateCartUI();
            showNotification(`تمت إضافة المزيج إلى السلة بنجاح ✨`);
        }

        function updateCartUI() {
            document.getElementById('bottomCartBadge').innerText = cart.reduce((s, i) => s + i.qty, 0);
            const container = document.getElementById('cartItemsContainer');
            const total = cart.reduce((s, i) => s + i.totalPrice, 0);

            document.getElementById('grandTotalText').innerText = `${total} ر.س`;
            if (cart.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-gray-400 py-8">السلة فارغة</p>`;
                return;
            }

            container.innerHTML = cart.map(i => `
                <div class="py-2 flex justify-between text-xs">
                    <div>
                        <h4 class="font-bold text-burgundy-900">${i.name}</h4>
                        <p class="text-[10px] text-gray-500">${i.details}</p>
                        <span class="font-bold text-burgundy-700">${i.totalPrice} ر.س</span>
                    </div>
                    <span class="font-black text-gray-700">x${i.qty}</span>
                </div>
            `).join('');
        }

        function toggleCartDrawer() { document.getElementById('cartDrawer').classList.toggle('hidden'); }
        function toggleSidebarDrawer() { document.getElementById('sidebarDrawer').classList.toggle('hidden'); }

        function sendOrderWhatsApp() {
            if (cart.length === 0) return;
            let msg = `*طلب جديد من آيس هوم 🍦*\n\n`;
            cart.forEach((i, idx) => {
                msg += `${idx + 1}. *${i.name}* (العدد: ${i.qty})\n   • التفاصيل: ${i.details}\n   • السعر: ${i.totalPrice} ر.س\n\n`;
            });
            const total = cart.reduce((s, i) => s + i.totalPrice, 0);
            msg += `*الإجمالي:* ${total} ر.س`;
            window.open(`https://wa.me/966500000000?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function showNotification(text) {
            const notif = document.getElementById('customNotification');
            document.getElementById('notificationText').innerText = text;
            notif.classList.remove('hidden');
            setTimeout(() => notif.classList.add('hidden'), 3000);
        }
    </script>
</body>
</html>
